<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Deutsch-Werkstatt</title>
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one mobile column, sticky header, fixed 6-tab bar. Article colours der/die/das carry meaning everywhere. */
  --paper:#F2EEE6; --card:#FBF8F2; --ink:#2E2A25; --muted:#6E665C; --line:#E2DBCF;
  --accent:#3C6E8F; --accent-ink:#FFFFFF; --soft:#E6EDEF;
  --der:#3566A8; --die:#B5473F; --das:#3F7F4E;
  --good:#2F6E45; --good-bg:#E4EFE3; --bad:#A33B33; --bad-bg:#F6E3DF; --warn:#94600F; --warn-bg:#F5E9D3;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1A18; --card:#252320; --ink:#E4DED3; --muted:#A39B8E; --line:#3A3631;
    --accent:#8FB4C9; --accent-ink:#1B1A18; --soft:#2E3337;
    --der:#86A9DB; --die:#E08E85; --das:#8CC79A;
    --good:#8CC79A; --good-bg:#23301F; --bad:#E39A91; --bad-bg:#3A2522; --warn:#E0B36E; --warn-bg:#3A2F1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1A18; --card:#252320; --ink:#E4DED3; --muted:#A39B8E; --line:#3A3631;
  --accent:#8FB4C9; --accent-ink:#1B1A18; --soft:#2E3337;
  --der:#86A9DB; --die:#E08E85; --das:#8CC79A;
  --good:#8CC79A; --good-bg:#23301F; --bad:#E39A91; --bad-bg:#3A2522; --warn:#E0B36E; --warn-bg:#3A2F1C;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.2rem;font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .sub{font-size:.78rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}

main{max-width:680px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 10px;font-size:.85rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.tile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile[disabled]{opacity:.55;cursor:default}
.tile b{font-family:var(--font-display);font-size:1rem}
.tile span{font-size:.85rem;color:var(--muted)}

input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:150px;resize:vertical;line-height:1.55}
label.lbl{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:700}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent)}

.art{font-weight:700}
.art.der{color:var(--der)} .art.die{color:var(--die)} .art.das{color:var(--das)}
.pill-der,.pill-die,.pill-das{display:inline-block;min-width:38px;text-align:center;border-radius:6px;padding:0 6px;font-weight:700;color:#fff;font-size:.85rem}
.pill-der{background:var(--der)} .pill-die{background:var(--die)} .pill-das{background:var(--das)}

.de{font-size:1.08rem}
.tr{color:var(--muted);font-size:.9rem}
.ex{border-left:3px solid var(--accent);padding:4px 0 4px 10px}
.rule{margin:0;padding-left:20px}
.rule li{margin-bottom:4px}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}

.fb{border-radius:10px;padding:10px 12px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .why{color:var(--ink);margin-top:4px}
.strike{text-decoration:line-through;color:var(--bad)}
.fixed{color:var(--good);font-weight:700}

.tokbox{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1px dashed var(--line);border-radius:10px}
.tok{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700;color:var(--ink)}
.tok.used{opacity:.3;pointer-events:none}

.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

.step{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.step input{width:24px;height:24px;flex:none;accent-color:var(--accent);margin-top:2px}
.step .num{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--accent);width:22px;text-align:center;flex:none}
.step.done{background:var(--good-bg);border-color:transparent}
.step.next{border-color:var(--accent)}
.step .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.step .meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-family:var(--font-display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;color:var(--ink)}
.week button.done{background:var(--good-bg);color:var(--good);border-color:transparent}
.week button.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.week button.sel{outline:2px solid var(--ink);outline-offset:1px}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--good)}

.note{font-size:.88rem;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
details summary{cursor:pointer;font-weight:700}
.copybox{font-size:.85rem;white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto}
.big{font-family:var(--font-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.kicker{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

.personas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;flex:none}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 12px;border-radius:14px;display:flex;flex-direction:column;gap:4px}
.bub.p{background:var(--soft);align-self:flex-start;border-bottom-left-radius:4px}
.bub.a{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.corr{align-self:flex-end;max-width:88%;font-size:.86rem;padding:8px 10px;border-radius:10px}
.corr.ok{background:var(--good-bg);color:var(--good)}
.corr.no{background:var(--bad-bg);color:var(--ink)}
.corr.no b{color:var(--good)}

.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mem button{min-height:70px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-weight:700;cursor:pointer;padding:6px;color:var(--ink);font-size:.92rem}
.mem button.open{background:var(--card);border-color:var(--accent)}
.mem button.done{background:var(--good-bg);color:var(--good);border-color:transparent}
.mem button.back{color:transparent}
.bav{display:flex;gap:12px;align-items:flex-start}
.bav .flag{width:36px;height:36px;border-radius:8px;flex:none;background:repeating-conic-gradient(#1E73BE 0 25%, #FFFFFF 0 50%) 0 0/12px 12px;border:1px solid var(--line)}
.sbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0;border-bottom:1px solid var(--line)}
.ctxbtn{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--radius);padding:12px 14px;cursor:pointer;min-height:64px;font:inherit}
.ctxbtn:hover{border-color:var(--accent)}
.ctxbtn.main{border-color:var(--accent);background:var(--soft);min-height:80px}
.ctxbtn .ic{font-size:1.8rem;width:2.2rem;text-align:center;flex:none}
.pw{border-radius:6px;padding:0 3px}
.pw.ok{background:var(--good-bg);color:var(--good)}
.pw.near{background:var(--warn-bg);color:var(--warn)}
.pw.miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.vcard{display:flex;flex-direction:column;gap:10px}
.vscene{position:relative;height:150px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;filter:saturate(.75)}
.vscene .m{font-size:76px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.vscene .s{position:absolute;font-size:34px;line-height:1}
.vscene .s0{left:14%;top:16%}.vscene .s1{right:13%;bottom:14%}.vscene .s2{right:16%;top:14%}.vscene .s9{left:10%;bottom:12%;font-size:22px}
:root[data-theme="dark"] .vscene{filter:saturate(.6) brightness(.72)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .vscene{filter:saturate(.6) brightness(.72)} }
.vword{text-align:center;font-family:var(--font-display);font-size:1.6rem;margin:4px 0 0}
.vhead{text-align:center;font-size:1.7rem;margin:4px 0 0}
.vsent{text-align:center;font-size:1.3rem;line-height:2}
.vin{font:inherit;font-size:1.15rem;padding:2px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--warn-bg);color:var(--ink);text-align:center}
.vblank{display:inline-block;border-bottom:2px solid var(--muted);margin:0 4px}
.story p{margin:6px 0;line-height:1.75;padding:2px 6px;border-radius:8px}
.story p.cur,.bub.cur{background:var(--soft)}
.tw{color:var(--accent);cursor:pointer}
.trb{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;font-size:.7rem;padding:1px 5px;cursor:pointer}
.chip.flame{background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-30px);opacity:0;transition:all .3s ease;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:60;display:flex;align-items:center;gap:8px;max-width:92vw}
.toast.in{transform:translate(-50%,0);opacity:1}
.xpfloat{position:fixed;right:18px;top:64px;color:var(--warn);font-weight:800;font-family:var(--font-display);z-index:60;animation:xpup 1.2s ease forwards;pointer-events:none}
@keyframes xpup{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-36px) scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.celebrate{position:fixed;inset:0;background:rgba(20,18,16,.55);display:flex;align-items:center;justify-content:center;z-index:65;padding:20px;animation:fadein .25s}
.cbox{background:var(--card);border-radius:22px;padding:22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.brezi{animation:bob 2.6s ease-in-out infinite;flex:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.quest{display:flex;align-items:center;gap:10px}.quest .qi{font-size:1.4rem;width:1.8rem;text-align:center}
.chestbtn{margin-top:10px;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.path{display:flex;align-items:center;overflow-x:auto;padding:8px 2px;gap:0}
.pnode{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.pnode .pc{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);font-size:1.2rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.pnode.done .pc{background:#E0B36E;color:#3a2a10}
.pnode.cur .pc{background:var(--accent);color:var(--accent-ink);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,180,201,.6)}70%{box-shadow:0 0 0 12px rgba(143,180,201,0)}100%{box-shadow:0 0 0 0 rgba(143,180,201,0)}}
.pnode small{font-size:.7rem;color:var(--muted)}
.pline{height:4px;width:22px;background:var(--line);flex:none;margin-bottom:18px;border-radius:2px}
.achgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.ach{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:var(--soft);opacity:.35;filter:grayscale(1);text-align:center}
.ach.on{opacity:1;filter:none}
.ach span{font-size:1.6rem}.ach small{font-size:.68rem;line-height:1.2}
.storyart{border-radius:14px;overflow:hidden;background:#f3e3c3;margin:6px 0}
.storyart svg{width:100%;height:auto;display:block}
@media (prefers-reduced-motion: reduce){.brezi,.chestbtn,.pnode.cur .pc{animation:none}}
.vphoto{position:relative;border-radius:16px;overflow:hidden;background:var(--soft)}
.vphoto img{width:100%;height:100%;object-fit:cover;display:block}
.vphoto .credit{position:absolute;right:6px;bottom:6px;font-size:.62rem;background:rgba(0,0,0,.45);color:#fff;padding:2px 6px;border-radius:6px;text-decoration:none}
.vphoto.ph{background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.wpop-wrap{position:fixed;inset:0;z-index:66;background:rgba(20,18,16,.35);display:flex;align-items:flex-end;justify-content:center}
.wpop{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px 26px;box-shadow:0 -10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px;animation:slideup .22s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.de,.vsent,.story,.chat .bub{cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Deutsch-Werkstatt</h1>
    <div class="sub">A2 → B1 · önce öğren, sonra üret</div>
  </div>
  <div class="chips" id="topchips"></div>
</header>
<main id="view" aria-live="polite"></main>
<nav class="nav" aria-label="Bölümler">
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9z"/></svg>Bugün</a>
  <a href="#seviye" data-tab="seviye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Seviyem</a>
  <a href="#more" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Daha fazla</a>
</nav>

<script>
"use strict";
/* ================= constants ================= */
const TOPICS = [
  "Präsens-Konjugation (sein, haben, Vokalwechsel)",
  "Verbposition: Verb an Position 2, W-Fragen, Ja/Nein-Fragen",
  "Modalverben, trennbare Verben, nicht/kein",
  "Nomen: Artikel, Plural, Großschreibung, Länder",
  "Akkusativ (den/einen/keinen, mich/dich)",
  "Perfekt (haben/sein + Partizip II)",
  "Präpositionen: Zeit (am, um, im) und Ort (in, ins, im, nach, zu) + mit Dativ",
  "Dativ (mit, bei, von; mir/dir; meinem/meiner)",
  "Nebensätze mit weil, dass, wenn",
  "Konjunktiv II: hätte, wäre, würde",
  "Reflexive Verben",
  "Adjektivendungen",
  "Präteritum: war, hatte, Modalverben",

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };

const Store = {
  async put(col, item){
    const data = {...item}; const id = data.id; delete data.id;
    Object.keys(data).forEach(k => { if(k.startsWith("_")) delete data[k]; });
    if(S.mode === "db"){
      try { await DB.collection(col).doc(id).set(data); } catch(e){ storeErr(e); }
    } else {
      const arr = S[col]; const i = arr.findIndex(x=>x.id===id);
      if(i>=0) arr[i] = {id, ...data}; else arr.push({id, ...data});
      saveLocal(); refresh();
    }
  },
  async del(col, id){
    if(S.mode === "db"){ try { await DB.collection(col).doc(id).delete(); } catch(e){ storeErr(e); } }
    else { S[col] = S[col].filter(x=>x.id!==id); saveLocal(); refresh(); }
  },
  _q: Promise.resolve(),
  saveState(){
    const snap = JSON.parse(JSON.stringify(S.state));
    if(S.mode === "db") this._q = this._q.then(()=>DB.doc("app/state").set(snap)).catch(storeErr);
    else saveLocal();
  }
};
function storeErr(e){

}

function subscribe(){
  const got = {words:false, mistakes:false, writings:false, state:false, weeks:false};
  const timer = setTimeout(()=>{ if(!S.loaded){ S.loadNote = "Verilerin henüz yüklenemedi. Bağlantın gelince kendiliğinden yüklenecek."; refresh(true); } }, 10000);
  const done = (k, snap) => {
    if(snap && snap.metadata && !snap.metadata.fromCache) got[k] = true;
    if(Object.values(got).every(Boolean) && !S.loaded){ S.loaded = true; S.loadNote = ""; clearTimeout(timer); }
    refresh();
  };
  const err = () => { clearTimeout(timer); S.loaded = true; S.loadNote = "Veri bağlantısı kesildi. Sayfayı daha sonra yeniden aç."; refresh(true); };
  DB.collection("words").onSnapshot(s => { S.words = s.docs.map(d=>({id:d.id, ...d.data()})); done("words", s); }, err);
  DB.collection("mistakes").onSnapshot(s => { S.mistakes = s.docs.map(d=>({id:d.id, ...d.data()})); done("mistakes", s); }, err);
  DB.collection("writings").orderBy("date","desc").limit(40).onSnapshot(s => { S.writings = s.docs.map(d=>({id:d.id, ...d.data()})); done("writings", s); }, err);
  DB.collection("weeks").onSnapshot(s => { S.weeksDb = s.docs.map(d=>JSON.parse(JSON.stringify(d.data()))).filter(w=>w && w.n && Array.isArray(w.days)); done("weeks", s); }, err);
  DB.doc("app/state").onSnapshot(s => { if(s.exists){ S.state = {...DEFAULT_STATE, ...JSON.parse(JSON.stringify(s.data()))}; } done("state", s); }, err);
}

function weeks(){
  const map = {1: WEEK1};
  for(const w of S.weeksDb) map[w.n] = w;
  return Object.values(map).sort((a,b)=>a.n-b.n);
}
const pkey = (w,d) => w.n+"-"+d.n;
function progOf(w,d){ return ((S.state.prog||{})[pkey(w,d)]) || []; }
function dayDone(w,d){ const p = progOf(w,d); return d.steps.filter(s=>!s.bonus).every(s=>p.includes(s.id)); }
function current(){
  for(const w of weeks()) for(const d of w.days) if(!dayDone(w,d)) return {w,d};
  const ws = weeks(); const w = ws[ws.length-1]; return {w, d:w.days[w.days.length-1], allDone:true};
}
function doneTopics(){ const out = []; for(const w of weeks()) for(const d of w.days) if(dayDone(w,d)) out.push(d.topic); return out; }
function selected(){
  if(S.sel){ const w = weeks().find(x=>x.n===S.sel.w); const d = w && w.days.find(x=>x.n===S.sel.d); if(w && d) return {w,d}; }
  return current();
}
function setStep(w, d, id, on){
  if(!S.state.prog) S.state.prog = {};
  const k = pkey(w,d); const arr = (S.state.prog[k] || []).filter(x=>x!==id);
  if(on) arr.push(id);
  S.state.prog[k] = arr;
  if(on && d.steps.filter(s=>!s.bonus).every(s=>arr.includes(s.id))){ const f = S.state.finishedOn || (S.state.finishedOn = {}); if(!f[k]) f[k] = dayKey(); }
  if(!S.state.days) S.state.days = {};
  const t = dayKey(); const dd = S.state.days[t] || {n:0};
  dd.n = Math.max(0, (dd.n||0) + (on?1:-1)); S.state.days[t] = dd;
  Store.saveState();
}
function planDone(kind, extra){
  const {w,d} = current();
  const p = progOf(w,d);
  const st = d.steps.find(s=>s.kind===kind && !p.includes(s.id) && (!extra || !s.game || s.game===extra));
  if(st){ setStep(w,d,st.id,true); S.flash = `Plan: "${st.t}" tamamlandı ✓`; }
}

async function addMistakes(list, source){
  let added = 0;
  for(const m of (list||[])){
    if(!m || !m.right) continue;
    recordTopic(MTOPICS.includes(m.topic) ? m.topic : "Sonstiges", false);
    const ex = S.mistakes.find(x => norm(x.right) === norm(m.right) || (m.wrong && norm(x.wrong) === norm(m.wrong)));
    if(ex) await Store.put("mistakes", {...ex, count:(ex.count||1)+1, streak:0, mastered:false, lastSeen:new Date().toISOString()});
    else {
      await Store.put("mistakes", {id:uid("m"), wrong:String(m.wrong||""), right:String(m.right), rule:String(m.rule_tr||m.rule||""), topic: MTOPICS.includes(m.topic)? m.topic : "Sonstiges", count:1, streak:0, mastered:false, source:source||"", added:new Date().toISOString(), lastSeen:new Date().toISOString()});
      added++;
    }
  }
  if((list||[]).length) Store.saveState();
  return added;
}
async function addWords(list){
  let n = 0;
  for(const w of (list||[])){
    if(!w || !w.de) continue;
    const de = String(w.de).trim();
    if(S.words.some(x => norm(x.de) === norm(de) && (x.artikel||"") === (w.artikel||""))) continue;
    await Store.put("words", {id:uid("w"), de, artikel:["der","die","das"].includes(w.artikel)? w.artikel : "", plural:String(w.plural||""), tr:String(w.tr||""), note:String(w.note||""), kind:String(w.kind || (["der","die","das"].includes(w.artikel)? "nomen":"andere")), right:0, wrong:0, box:0, due:dayKey(), added:new Date().toISOString()});
    n++;
  }
  return n;
}

function todayQueue(){

  if(dd.recheck) q.push({key:"recheck", kind:"recheck", title:"Kontrol: "+(TL[dd.recheckTopic]||dd.recheckTopic||""), min:3, done:true});
  else if(rc) q.push({key:"recheck", kind:"recheck", title:"Kontrol: "+rc.label, min:3, topic:rc.t, done:false});
  const due = S.words.filter(w=>(w.due||t)<=t).length + Math.min(5, S.mistakes.filter(m=>!m.mastered).length);
  if(dd.skipExtras){} else if(dd.review) q.push({key:"review", kind:"review", title:"Günlük tekrar", min:10, done:true});
  else if(due) q.push({key:"review", kind:"review", title:"Günlük tekrar", min:10, done:false});
  const wk = dd.skipExtras ? null : weakTopics()[0];
  if(dd.skipExtras){} else if(dd.remed) q.push({key:"remed", kind:"remed", title:"Takviye: "+(TL[dd.remedTopic]||dd.remedTopic||""), min:15, done:true});
  else if(wk) q.push({key:"remed", kind:"remed", title:"Takviye: "+wk.label, min:15, topic:wk.t, done:false});
  const {w, d} = current();
  let dayW = w, dayD = d;
  if(finishedToday() && !S.forceNext){
    const k = Object.entries(S.state.finishedOn||{}).find(([k,v])=>v===t);
    if(k){ const [wn, dn] = k[0].split("-").map(Number); const ww = weeks().find(x=>x.n===wn); const dx = ww && ww.days.find(x=>x.n===dn); if(ww && dx){ dayW = ww; dayD = dx; } }
  }
  const p = progOf(dayW, dayD);
  for(const st of dayD.steps.filter(x=>!x.bonus)) q.push({key:"step-"+st.id, kind:st.kind, title:st.t, min:st.min, step:st, w:dayW, d:dayD, done:p.includes(st.id)});

async function listenGen(bg){
  const L = S.listen; if(!bg) stopSpeech(); L.err = ""; L.busy = true; L.script = null; L.i = 0; L.done = false; L.copied = false; L.played = false; if(!bg) render();

Erstelle eine Hör-Lektion (ca. 6-8 Minuten gesprochen), die der Lerner NUR HÖRT, z. B. beim Autofahren. Er kann nicht lesen. Thema: ${current().d.topic}.${phrases.length ? " Wiederhole auch diese Sätze, die er gerade lernt: "+JSON.stringify(phrases) : ""}

WICHTIG FÜR DIE SPRACHAUSGABE: Ein türkisches Segment wird von einer türkischen Stimme gelesen. Jedes deutsche Wort oder jeden deutschen Satz INNERHALB eines türkischen Segments MUSST du in ⟦ ⟧ einschließen, z. B. "Şimdi ⟦der Termin⟧ kelimesini öğreniyoruz." Deutsche Segmente (lang "de") enthalten nur Deutsch, ohne Klammern. Nie Deutsch ohne ⟦ ⟧ in einem türkischen Segment!

function chunksOf(seg){
  if(seg.lang === "de") return [{lang:"de", text:seg.text.replace(/[⟦⟧]/g,""), sp:seg.sp||"", g:seg.g||""}];

  while((m = re.exec(seg.text))){ if(m.index > last) out.push({lang:"tr", text:seg.text.slice(last, m.index)}); out.push({lang:"de", text:m[1]||m[2]}); last = re.lastIndex; }

}

  const cv = c.lang === "de" && c.sp ? castFor(L.cast || (L.cast = makeCast()), c.sp, c.g) : null;
  const v = (cv && cv.voice) || voiceFor(c.lang); if(v) u.voice = v; if(cv && cv.pitch) u.pitch = cv.pitch;

function speakCurrent(){
  const L = S.listen, sc = L.script; if(!sc || !L.playing) return;
  const seg = sc.segments[L.i];
  if(!seg){ L.playing = false; L.done = true; L.played = true; addXP(10); if(S.sess && CTXS[S.sess.ctx].audio) setTimeout(()=>{ if(S.sess && !S.brk && !S.sess.paused && S.view==="sprechen") sessNext(); }, 1500); const d = S.state.days || (S.state.days = {}); const t = dayKey(); const dd = d[t] || {n:0}; dd.listen = (dd.listen||0) + 1; dd.n = (dd.n||0) + 1; d[t] = dd; Store.saveState(); if(S.view==="sprechen") render(); return; }
  try{
    speakChunk(chunksOf(seg), 0, () => { if(!L.playing) return; ttsTimer = setTimeout(()=>{ if(!L.playing) return; L.i++; if(S.view==="sprechen") render(); speakCurrent(); }, (seg.pause||0)*1000 + 350); });

}

function startExercise(title, items, source, home, game){
  items = (items||[]).filter(it => it && it.kind && (it.answer !== undefined || (it.answers && it.answers.length)));
  if(!items.length){ const m = "Alıştırma oluşturulamadı. Bir kez daha dene."; if(home==="spielen"){ S.gameErr = m; } else S.learn.err = m; render(); return; }
  for(const it of items){
    if(it.kind === "order"){ const toks = String(it.answer).replace(/[.!?]+$/,"").split(/\s+/).filter(Boolean); it._tokens = shuffle(toks.map(t=>({t}))); it._built = []; }
    if(it.kind === "choice") it._opts = shuffle(it.options||[]);
    if(it.kind === "artikel") it._opts = ["der","die","das"];
  }
  S.ex = { title, items, i:0, results:[], source, home: home||"lernen", game: game||null, start: Date.now(), checked:false, user:"", feedback:null, judging:false, summary:null };
  render();
}

      ${e.checked ? `<button class="btn primary" data-act="exNext">${e.i+1<n ? "Sonraki" : "Sonucu gör"}</button>` : ""}

function fillGap(prompt, ans){ return String(prompt).includes("___") ? String(prompt).replace("___", ans) : ans; }
function exCheck(){
  const e = S.ex, it = curItem();
  let user = e.user, ok = false, right = it.answer;
  if(it.kind === "order"){ user = it._built.map(b=>it._tokens[b].t).join(" "); ok = norm(user) === norm(it.answer); }
  else if(it.kind === "gap"){ const answers = it.answers && it.answers.length ? it.answers : [it.answer]; ok = answers.some(a=>norm(a)===norm(user)); right = answers[0]; }
  else if(it.kind === "tf"){ ok = (user === "true") === (it.correct === true); right = it.correct ? "" : it.answer; if(it.correct) right = ""; }
  else if(it.kind === "dict"){ const sc = scoreHeard(it.answer, user); ok = sc.score >= 0.9; e.checked = true; e.user = user; e.feedback = { ok, right: it.answer, explain:"", words: sc.words, pct: Math.round(sc.score*100) }; e.results[e.i] = { ok, user, pct: Math.round(sc.score*100) }; render(); sfx(ok ? "ok" : "no"); return; }
  else ok = norm(user) === norm(it.answer);
  e.checked = true; e.user = user;
  e.feedback = { ok, right: it.kind==="tf" ? (it.correct ? "" : it.answer) : right, explain: it.explain||"" };
  e.results[e.i] = { ok, user };
  render(); sfx(ok ? "ok" : "no");
  /* doğru cevaptan sonra kendiliğinden geçmez: açıklamayı okuyup "Devam"a sen basarsın */
}
async function exJudge(){
  const e = S.ex, it = curItem();
  e.judging = true; render();
  try{
    const r = await askJSON(`Du prüfst eine Antwort eines A2-Deutschlerners (Muttersprache Türkisch).
Aufgabe (${it.kind}): ${it.kind==="produce" ? "Übersetze ins Deutsche: "+it.prompt : (it.prompt || "(Satz aus Wörtern bauen)")}
Erwartete Lösung: ${it.kind==="gap" ? fillGap(it.prompt, (it.answers||[it.answer])[0]) : it.answer}
Antwort des Lerners: ${it.kind==="gap" ? fillGap(it.prompt, e.user) : e.user}
Ist die Antwort grammatisch korrekt und passt sie zur Aufgabe (bei Übersetzungen: gleiche Bedeutung, natürliches Deutsch)? Groß-/Kleinschreibung am Satzanfang ignorieren.
Antworte NUR mit JSON: {"correct": true, "comment_tr": "ein kurzer Satz auf Türkisch"}`, {tier:"quick"});
    e.feedback.judged = true;
    if(r && r.correct === true){ e.feedback.ok = true; e.results[e.i].ok = true; e.feedback.judge = "Senin cevabın da doğru. " + (r.comment_tr||""); }
    else e.feedback.judge = (r && r.comment_tr) || "";
  }catch(err){ e.feedback.judge = aiMsg(err); }
  e.judging = false; render();
}
async function exFinish(){
  const e = S.ex; const t = dayKey();
  const wrong = []; const wUpd = {}; const mUpd = {};
  e.items.forEach((it,i)=>{ const r = e.results[i]; if(!r) return;
    if(it.wid){ (wUpd[it.wid] = wUpd[it.wid] || []).push(r.ok); return; }
    if(it.mid){ (mUpd[it.mid] = mUpd[it.mid] || []).push(r.ok); return; }
    if(!r.ok && it.kind !== "tf" && it.kind !== "artikel" && it.kind !== "dict" && !it.audio){
      wrong.push({ wrong: it.kind==="gap" ? fillGap(it.prompt, r.user||"…") : (r.user||""), right: it.kind==="gap" ? fillGap(it.prompt, (it.answers||[it.answer])[0]) : it.answer, rule_tr: it.explain||"", topic: it.topic||"Sonstiges" });
    }
    if(!r.ok && it.kind === "tf" && !it.correct) wrong.push({ wrong: it.prompt, right: it.answer, rule_tr: it.explain||"", topic: it.topic||"Sonstiges" });
  });
  e.items.forEach((it,i)=>{ const r = e.results[i]; if(!r) return; const tp = it.kind==="artikel" ? "Artikel" : (MTOPICS.includes(it.topic) ? it.topic : null); if(tp) recordTopic(tp, r.ok); });
  const okN = e.results.filter(r=>r&&r.ok).length;
  addXP(okN*2 + 3); if(okN === e.items.length && e.items.length >= 5){ confetti(80); sfx("up"); }
  const secs = Math.round((Date.now()-e.start)/1000);
  e.summary = { okN, n:e.items.length, logged:0, mastered:0, secs };
  if(e.game){ const score = okN*10 + Math.max(0, Math.round((e.items.length*25 - secs)/3)); e.summary.score = score; const g = S.state.games || (S.state.games = {}); const best = g[e.game] || 0; e.summary.best = best; if(score > best){ g[e.game] = score; e.summary.record = true; } Store.saveState(); }
  if(e.source === "remed" || e.source === "recheck") remedResult(e, okN);
  if(e.source === "review") daily().review = true;
  if(e.source === "remed"){ const dd = daily(); dd.remed = true; dd.remedTopic = e.remedTopic; }
  if(e.source === "recheck"){ const dd = daily(); dd.recheck = true; dd.recheckTopic = e.remedTopic; }
  Store.saveState();
  if(e.items.some(it=>it.kind==="dict")){ const ps = e.results.filter(Boolean).map(r=>r.pct||0); const avg = ps.length ? Math.round(ps.reduce((a,b)=>a+b,0)/ps.length) : 0; e.summary.dictPct = avg; const dl = S.state.dictLog || (S.state.dictLog = []); dl.push({date:dayKey(), pct:avg, src:e.source}); S.state.dictLog = dl.slice(-60); if(e.source==="check" && S.check) S.check.dict = avg; Store.saveState(); }
  if(e.source === "dict") planDone("dict");
  else if(e.source === "repair") planDone("repair");
  else if(e.source === "media" && S.media){ S.media.pct = Math.round(okN/e.items.length*100); }
  if(e.source === "review"){ const rl = S.state.revLog || (S.state.revLog = []); rl.push({date:dayKey(), pct:Math.round(okN/Math.max(1,e.items.length)*100)}); S.state.revLog = rl.slice(-40); Store.saveState(); }
  if(e.source === "lesson" && S.a12ctx){ a12LessonResult(e, okN); }
  else if(e.source === "a12test"){ a12TestResult(e, okN); }
  else if(e.source === "lesson"){
    const pct = Math.round(okN/Math.max(1,e.items.length)*100); lessonPassRecord(pct);
    const {w:cw, d:cd} = current(); const k = pkey(cw,cd); const tries = S.state.lessonTry || (S.state.lessonTry = {}); tries[k] = (tries[k]||0)+1;
    e.summary.lessonPct = pct; e.summary.lessonPass = pct >= 75 || (tries[k] >= 2 && pct >= 60);
    if(e.summary.lessonPass) planDone("lesson");
  }
  else if(e.source === "review") planDone("review");
  else if(e.source === "test") planDone("test");
  else if(e.game) planDone("game", e.game);
  render();
  for(const id in wUpd){ const w = S.words.find(x=>x.id===id); if(!w) continue; const okAll = wUpd[id].every(Boolean);
    let box = w.box||0; box = okAll ? Math.min(INTERVALS.length-1, box+1) : 0;
    await Store.put("words", {...w, box, due: addDays(t, okAll ? INTERVALS[box] : 1), right:(w.right||0)+wUpd[id].filter(Boolean).length, wrong:(w.wrong||0)+wUpd[id].filter(x=>!x).length}); }
  for(const id in mUpd){ const m = S.mistakes.find(x=>x.id===id); if(!m) continue; const c = {...m};
    if(mUpd[id].some(x=>!x)){ c.streak = 0; c.count = (c.count||1)+1; c.mastered = false; } else { c.streak = (c.streak||0)+1; if(c.streak>=3){ c.mastered = true; e.summary.mastered++; } }
    c.lastSeen = new Date().toISOString(); await Store.put("mistakes", c); }
  if(wrong.length) e.summary.logged = await addMistakes(wrong, e.title);
  render();
}

function meaningItem(w){
  const others = shuffle(S.words.filter(x=>x.id!==w.id && x.kind!=="satz" && x.tr && norm(x.tr)!==norm(w.tr)).map(x=>x.tr)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,2);
  if(others.length < 2 || !w.tr) return null;
  return {kind:"choice", prompt:`"${(w.artikel?w.artikel+" ":"")+w.de}" ne demek?`, options:[w.tr, ...others], answer:w.tr, wid:w.id, explain:`${(w.artikel?w.artikel+" ":"")+w.de}${w.plural?" · die "+w.plural:""} = ${w.tr}${w.note?" · "+w.note:""}`, topic:"Wortwahl"};
}
function startReview(){
  const L = S.learn; L.err = ""; L.lesson = null; S.ex = null;
  const t = dayKey();
  const due = S.words.filter(w=>(w.due||t) <= t).sort((a,b)=>String(a.due||"").localeCompare(String(b.due||""))).slice(0,12);
  const items = [];
  for(const w of due){
    if(w.kind === "satz"){ items.push({kind:"produce", prompt:w.tr, answer:w.de, wid:w.id, explain:w.de, topic:"Wortwahl"}); continue; }
    if(isNoun(w) && Math.random() < 0.7) items.push({kind:"artikel", prompt:w.de, answer:w.artikel, wid:w.id, tr:w.tr, explain:`${w.artikel} ${w.de}${w.plural?" · die "+w.plural:""} = ${w.tr}`, topic:"Artikel"});
    else { const m = meaningItem(w); if(m) items.push(m); else if(isNoun(w)) items.push({kind:"artikel", prompt:w.de, answer:w.artikel, wid:w.id, tr:w.tr, explain:`${w.artikel} ${w.de} = ${w.tr}`, topic:"Artikel"}); }
  }
  const ms = S.mistakes.filter(m=>!m.mastered).sort((a,b)=>String(a.lastSeen||"").localeCompare(String(b.lastSeen||""))).slice(0,5);
  for(const m of ms) items.push({kind:"fix", prompt:m.wrong, answer:m.right, mid:m.id, hint:m.rule, explain:m.rule, topic:m.topic});
  if(!items.length){ daily().review = true; Store.saveState(); S.flash = "Bugün tekrar edilecek bir şey yok. Tekrar adımı tamamlandı ✓"; render(); return; }
  startExercise("Günlük tekrar", items, "review", "lernen");
}
function startLocal(kind){
  const L = S.learn; L.err = ""; S.ex = null;
  let pool, items, title;
  if(kind === "artikel"){
    pool = S.words.filter(isNoun);
    if(pool.length < 4){ L.err = "Artikel çalışması için kartlarında en az 4 isim olmalı."; render(); return; }
    const sel = pick(pool.sort((a,b)=>((b.wrong||0)-(b.right||0))-((a.wrong||0)-(a.right||0))).slice(0,30), 10);
    items = sel.map(w=>({kind:"artikel", prompt:w.de, answer:w.artikel, wid:w.id, tr:w.tr, explain:`${w.artikel} ${w.de}${w.plural?" · die "+w.plural:""}`, topic:"Artikel"}));
    title = "Artikel";
    L.lesson = { kind:"preview", title:"Önce bak: bu 10 kelime", title2:title, intro_tr:"Her kelimeyi artikeliyle birlikte sesli söyle. Renkler yardımcı olur: der mavi, die kırmızı, das yeşil.", words: sel, _items: items, examples:[] };
  } else {
    pool = S.words.filter(w=>isNoun(w) && w.plural && w.plural !== "-" && norm(w.plural) !== norm(w.de));
    if(pool.length < 4){ L.err = "Çoğul çalışması için kartlarında çoğulu yazılı en az 4 isim olmalı."; render(); return; }
    const sel = pick(pool, 8);
    items = sel.map(w=>({kind:"gap", prompt:`${w.artikel} ${w.de} → die ___`, answers:[w.plural], wid:w.id, tr:w.tr, explain:`${w.artikel} ${w.de} → die ${w.plural}`, topic:"Plural"}));
    title = "Çoğul";
    L.lesson = { kind:"preview", title:"Önce bak: tekil → çoğul", title2:title, intro_tr:"Çoğulda artikel her zaman die olur. Ekleri dikkatle oku ve sesli söyle.", words: sel, _items: items, examples:[], rule_tr:["Çoğulda artikel her zaman die: der Gast → die Gäste.","Almancada çoğul genellikle -s ile yapılmaz; çoğu kelime -e, -en, -er alır ya da hiç değişmez."] };
  }
  render();
}

function cleanTurns(){
  const T = S.talk; const first = T.turns[0];
  let rest = T.turns.slice(1);
  if(rest.length > 16) rest = rest.slice(rest.length - 16);
  if(rest.length && rest[0].role === "user") rest = rest.slice(1);
  return [first, ...rest];
}
async function talkStart(){
  const T = S.talk; T.started = true; T.busy = true; T.err = "";
  T.turns = [{role:"user", content: chatRules() + "\n\nStarte jetzt das Gespräch mit deiner ersten Nachricht (ok=true, better leer)."}];
  render();
  try{
    const r = await askJSON(T.turns, {tier:"quick"});
    T.turns.push({role:"assistant", content: JSON.stringify(r)});
    T.msgs.push({who:"p", de:r.reply||"", tr:r.reply_tr||""});
  }catch(err){ T.err = aiMsg(err); }
  T.busy = false; render();
  if(T.voice && !T.err) rpSpeak();
}
async function talkSend(){
  const T = S.talk; const ta = $("#chatIn"); if(ta) T.input = ta.value;
  const msg = (T.input||"").trim(); if(!msg) return;
  T.input = ""; T.help = null; T.err = "";
  markUsed(msg, "sohbet");
  const me = {who:"a", de:msg, checked:false};
  T.msgs.push(me); T.turns.push({role:"user", content: msg}); T.busy = true; render();
  try{
    const r = await askJSON(cleanTurns(), {tier:"quick"});
    T.turns.push({role:"assistant", content: JSON.stringify(r)});
    bumpOut("chat");
    me.checked = true; me.ok = r.ok !== false || !r.better || norm(r.better) === norm(msg); me.better = r.better||""; me.note = r.note_tr||""; me.topic = r.topic||"";
    T.msgs.push({who:"p", de:r.reply||"", tr:r.reply_tr||""});
  }catch(err){ T.err = aiMsg(err); T.turns.pop(); T.msgs.pop(); T.input = msg; }
  T.busy = false; render();
  if(T.voice){ if(!T.err){ if(!me.ok && me.better){ const go = await rpRepeat(me); if(!go) return; } rpSpeak(); } return; }
  const box = $("#chatIn"); if(box) box.scrollIntoView({block:"center"});
}

async function talkEnd(){
  const T = S.talk; const mine = T.msgs.filter(m=>m.who==="a" && m.checked);
  const bad = mine.filter(m=>!m.ok && m.better);
  T.ended = { total: mine.length, ok: mine.length - bad.length, logged: 0 };
  addXP(Math.min(30, 3*mine.length));
  if(T.voice){ T.speaking = false; T.listening = false; try { if(TTS.ok) window.speechSynthesis.cancel(); } catch(e){} rpLog(T); if(mine.length >= 3) planDone("roleplay"); if(T.scenId && mine.length >= 2) scenComplete(T.scenId); }
  else if(mine.length >= 3) planDone("chat");
  render();
  T.ended.logged = await addMistakes(bad.map(m=>({wrong:m.de, right:m.better, rule_tr:m.note, topic:m.topic})), "Sohbet: "+PERSONAS[T.pid].name);
  render();
}

let sprintIv = null;
function sprintTick(){
  const sp = S.speak.sprint; if(!sp || sp.result || sp.busy || sp.err){ clearInterval(sprintIv); return; }
  sp.left = Math.max(0, Math.round((sp.deadline - Date.now())/1000));
  const el = $("#sprintTime"); if(el) el.textContent = sp.left + "s";
  if(sp.left === 0) sprintNext();
}
async function sprintStart(){
  const P = S.speak, c = P.card;
  P.sprint = {busy:true, busyText:"Sorular hazırlanıyor…"}; render();
  try{
    const r = await askJSON(`Du bist ein persönlicher Deutschlehrer. ${profile()}
Situation: "${P.sit}". Der Lerner hat diese Sätze gelernt: ${JSON.stringify((c&&c.phrases||[]).map(p=>p.de))}
Erstelle 6 kurze Fragen, die ein Gesprächspartner in dieser Situation stellt. Der Lerner soll sie mit den gelernten Sätzen beantworten können. A2.
Antworte NUR mit JSON: {"questions":[{"de":"Frage","tr":"türkisch","hint_de":"Anfang einer möglichen Antwort, 2-4 Wörter"}]}`, {tier:"quick"});
    const qs = (r && r.questions || []).filter(q=>q && q.de).slice(0,6);
    if(!qs.length) throw {code:"invalid_json"};
    P.sprint = {qs, i:0, answers:[], cur:"", left:45, deadline:Date.now()+45000};
    clearInterval(sprintIv); sprintIv = setInterval(sprintTick, 500);
  }catch(err){ P.sprint = {err: aiMsg(err)}; }
  render();
}
async function sprintNext(){
  const sp = S.speak.sprint; if(!sp || sp.busy || sp.result) return;
  const ta = $("#sprintAns"); if(ta) sp.cur = ta.value;
  sp.answers[sp.i] = sp.cur || ""; sp.cur = "";
  if(sp.i + 1 < sp.qs.length){ sp.i++; sp.left = 45; sp.deadline = Date.now()+45000; render(); return; }
  clearInterval(sprintIv); sp.busy = true; sp.busyText = "Cevapların düzeltiliyor…"; render();
  try{
    const pairs = sp.qs.map((q,i)=>({q:q.de, a:sp.answers[i]||""}));
    const r = await askJSON(`Du bist ein persönlicher Deutschlehrer. ${profile()}
Situation: "${S.speak.sit}". Der Lerner hat schnell geantwortet (oft per Spracheingabe; ignoriere fehlende Satzzeichen und kleine Erkennungsfehler):
${JSON.stringify(pairs)}
Korrigiere jede Antwort kurz und natürlich (gesprochene Sprache, A2). Leere Antwort: gib eine einfache Musterantwort.
Antworte NUR mit JSON: {"summary_tr":"1-2 Sätze Feedback auf Türkisch","results":[{"q":"…","a":"…","ok":true,"corrected":"…","note_tr":"kurz, Türkisch"}],"mistakes":[{"wrong":"…","right":"…","rule_tr":"…","topic":"eine von: ${MTOPICS.join(", ")}"}]}`);
    sp.result = r; sp.busy = false; bumpOut("sprint"); render();
    await addMistakes(r.mistakes||[], "Hızlı cevap"); return;
  }catch(err){ sp.err = aiMsg(err); }
  sp.busy = false; render();
}

function gameWords(n){
  const recent = S.words.filter(w=>w.tr).sort((a,b)=>String(b.added||"").localeCompare(String(a.added||"")));
  const due = recent.filter(w=>(w.due||dayKey())<=dayKey());
  const pool = [...due, ...recent].filter((w,i,a)=>a.indexOf(w)===i).slice(0, 40);
  return pick(pool, n);
}
function startGame(kind, topic){
  S.gameErr = ""; S.ex = null; S.game = null;
  if(kind === "memory"){
    const ws = gameWords(6);
    if(ws.length < 4){ S.gameErr = "Memory için kartlarında Türkçesi yazılı en az 4 kelime olmalı."; render(); return; }
    const cards = shuffle(ws.flatMap((w,i)=>[{k:i, txt:(w.artikel?w.artikel+" ":"")+w.de, de:true}, {k:i, txt:w.tr}]));
    S.game = {type:"memory", cards, open:[], done:new Set(), moves:0, start:Date.now(), lock:false, ws};
  } else if(kind === "blitz"){
    if(S.words.filter(w=>w.tr).length < 4){ S.gameErr = "Blitz için kartlarında en az 4 kelime olmalı."; render(); return; }
    S.game = {type:"blitz", score:0, combo:0, left:60, end:Date.now()+60000, q:null, fb:null, over:false, n:0};
    nextBlitz(); clearInterval(S.blitzIv); S.blitzIv = setInterval(blitzTick, 250);
  } else if(kind === "builder" || kind === "hunt"){ aiGame(kind, topic || current().d.topic); return; }
  render();
}
async function aiGame(kind, topic){
  S.gameBusy = true; render();
  try{
    const r = kind === "builder" ? await askJSON(`Du bist ein persönlicher Deutschlehrer. ${profile()}
Spiel "Satz-Baumeister" zum Thema: ${topic}. Erstelle 8 korrekte, natürliche Sätze (5-9 Wörter) aus dem Leben des Lerners, die genau dieses Thema zeigen. Nur Wörter, die der Lerner kennt.
Antworte NUR mit JSON: {"items":[{"kind":"order","answer":"Danach arbeite ich im Homeoffice.","tr":"türkisch","explain":"1 kurzer Satz Türkisch zur Regel","topic":"eine von: ${MTOPICS.join(", ")}"}]}`, {tier:"quick"})
      : await askJSON(`Du bist ein persönlicher Deutschlehrer. ${profile()}
Spiel "Fehlerjagd" zum Thema: ${topic}. Erstelle 10 kurze Sätze aus dem Leben des Lerners: 5 korrekt, 5 mit genau einem typischen Fehler zum Thema (wie ihn Türkischsprecher machen). Nur bekannte Wörter.
Antworte NUR mit JSON: {"items":[{"kind":"tf","prompt":"der Satz","correct":true,"answer":"der korrekte Satz (bei korrekten Sätzen identisch)","tr":"türkisch (korrekter Satz)","explain":"1 kurzer Satz Türkisch: was ist falsch / warum richtig","topic":"eine von: ${MTOPICS.join(", ")}"}]}`, {tier:"quick"});
    S.gameBusy = false;

    startExercise(kind === "builder" ? "Satz-Baumeister" : "Fehlerjagd", items, "game", "spielen", kind);
    return;
  }catch(err){ S.gameErr = aiMsg(err); }
  S.gameBusy = false; render();
}
function renderMemory(){
  const G = S.game; const allDone = G.done.size === G.cards.length;
  if(allDone && !G.result){
    const secs = Math.round((Date.now()-G.start)/1000); const score = Math.max(10, 200 - G.moves*5 - secs);
    const g = S.state.games || (S.state.games = {}); const best = g.memory||0; G.result = {secs, score, record: score>best, best};
    if(score > best){ g.memory = score; } Store.saveState(); planDone("game","memory");
  }
  return `
  <section class="card"><div class="row between"><span class="kicker">Memory</span><span class="small muted">${G.moves} hamle</span></div>
    ${G.result ? `<div class="fb ok"><b>${G.result.score} puan</b> · ${G.result.secs} sn ${G.result.record?"· Yeni rekor!":G.result.best?`· Rekor: ${G.result.best}`:""}</div>` : `<p class="small muted">Almanca kelimeyi Türkçesiyle eşleştir.</p>`}
    <div class="mem">${G.cards.map((c,i)=>{ const open = G.open.includes(i), done = G.done.has(i); return `<button class="${done?"done":open?"open":"back"}" data-act="memFlip" data-i="${i}" ${done||G.result?"disabled":""} aria-label="${open||done?esc(c.txt):"Kapalı kart"}">${open||done ? esc(c.txt) : "?"}</button>`; }).join("")}</div>
    ${G.result ? `<div class="list">${G.ws.map(w=>`<div class="li"><div class="main">${wordLabel(w)} = <span class="tr">${esc(w.tr)}</span></div></div>`).join("")}</div>` : ""}
    ${G.result ? continueBtn() : ""}
    <div class="row"><button class="btn" data-act="game" data-g="memory">Yeni oyun</button><button class="btn ghost" data-act="gameBack">Oyunlara dön</button></div>
  </section>`;
}
function memFlip(i){
  const G = S.game; if(G.lock || G.open.includes(i) || G.done.has(i)) return;
  G.open.push(i);
  if(G.open.length === 2){
    G.moves++; const [a,b] = G.open;
    if(G.cards[a].k === G.cards[b].k && G.cards[a].de !== G.cards[b].de){ G.done.add(a); G.done.add(b); G.open = []; }
    else { G.lock = true; setTimeout(()=>{ G.open = []; G.lock = false; if(S.view==="spielen") render(); }, 900); }
  }
  render();
}
function nextBlitz(){
  const G = S.game; const pool = S.words.filter(w=>w.tr); const w = pool[Math.floor(Math.random()*pool.length)];
  let q;
  if(isNoun(w) && Math.random() < 0.55) q = {kind:"artikel", prompt:w.de, opts:["der","die","das"], answer:w.artikel, w};
  else { const m = meaningItem(w); q = m ? {kind:"choice", prompt:m.prompt, opts:shuffle(m.options), answer:m.answer, w} : {kind:"artikel", prompt:w.de, opts:["der","die","das"], answer:w.artikel||"der", w}; }
  G.q = q; G.fb = null;
}
function blitzTick(){
  const G = S.game; if(!G || G.type !== "blitz" || G.over){ clearInterval(S.blitzIv); return; }
  G.left = Math.max(0, Math.ceil((G.end - Date.now())/1000));
  const el = $("#blitzTime"); if(el) el.textContent = G.left + " sn";
  if(G.left === 0){ G.over = true; clearInterval(S.blitzIv); const g = S.state.games || (S.state.games = {}); G.best = g.blitz||0; if(G.score > G.best) g.blitz = G.score; Store.saveState(); planDone("game","blitz"); if(S.view==="spielen") render(); }
}
function renderBlitz(){
  const G = S.game;
  if(G.over) return `<section class="card hl"><div class="kicker">60 saniye Blitz</div><div class="big">${G.score} puan</div><p>${G.n} soru · ${G.score > (G.best||0) ? "Yeni rekor! 🎉" : `Rekor: ${G.best}`}</p>${continueBtn()}<div class="row"><button class="btn" data-act="game" data-g="blitz">Tekrar oyna</button><button class="btn ghost" data-act="gameBack">Oyunlara dön</button></div></section>`;
  const q = G.q;
  return `
  <section class="card hl">
    <div class="row between"><span class="kicker">60 saniye Blitz</span><span class="chip" id="blitzTime">${G.left} sn</span></div>
    <div class="row between"><span class="big">${G.score}</span><span class="small muted">${G.combo>1?`${G.combo}× seri`:""}</span></div>
    <p class="de"><b>${q.kind==="artikel" ? "___ "+esc(q.prompt) : esc(q.prompt)}</b></p>
    <div class="${q.kind==="artikel"?"row":"stack"}">${q.opts.map(o=>`<button class="btn ${q.kind==="artikel"?"":"block"}" data-act="blitzAns" data-o="${esc(o)}">${q.kind==="artikel"?`<span class="pill-${o}">${esc(o)}</span>`:esc(o)}</button>`).join("")}</div>
    ${G.fb ? `<div class="fb ${G.fb.ok?"ok":"no"}">${G.fb.ok?"Doğru!":"Doğrusu: "+esc(G.fb.right)}</div>` : ""}
  </section>`;
}
function blitzAns(o){
  const G = S.game; if(!G || G.over) return; const q = G.q; G.n++;
  const ok = norm(o) === norm(q.answer);
  if(ok){ G.combo++; G.score += 10 + Math.min(G.combo-1, 5)*2; } else G.combo = 0;
  const label = q.kind==="artikel" ? `${q.answer} ${q.prompt}` : q.answer;
  nextBlitz(); G.fb = {ok, right: label}; render();
}


/* ================= progress model ================= */
function recordTopic(topic, ok){
  if(!topic) return;
  const st = S.state.topics || (S.state.topics = {});
  const s = st[topic] || {r:0, w:0, ema:0.5};
  if(ok) s.r = (s.r||0)+1; else s.w = (s.w||0)+1;
  s.ema = Math.round(((s.ema ?? 0.5)*0.8 + (ok?1:0)*0.2)*1000)/1000;
  s.last = dayKey(); st[topic] = s;
}
function bumpOut(k){ const o = S.state.out || (S.state.out = {}); o[k] = (o[k]||0)+1; Store.saveState(); }
function topicStats(){
  const st = S.state.topics || {}; const open = {};
  S.mistakes.filter(m=>!m.mastered).forEach(m=>{ open[m.topic] = (open[m.topic]||0) + (m.count||1); });
  return MTOPICS.filter(t=>t!=="Sonstiges").map(t=>{ const s = st[t] || {}; const n = (s.r||0)+(s.w||0);
    const ema = n ? s.ema : null;
    const score = ema !== null ? ema : (open[t] ? Math.max(0.2, 0.6 - 0.1*open[t]) : null);
    return {t, label:TL[t], n, ema, score, open:open[t]||0, recheck:s.recheck||"", solid:!!s.solid, remed:s.remed||null}; });
}
function statusOf(x){
  if(x.score === null) return {txt:"Veri yok", cls:""};
  if(x.score >= 0.8 && x.open <= 1) return {txt:"Sağlam", cls:"good"};
  if(x.score >= 0.6) return {txt:"Gelişiyor", cls:"warn"};
  return {txt:"Zayıf", cls:"bad"};
}
function weakTopics(){
  const t = dayKey();
  return topicStats().filter(x => !(x.recheck && x.recheck > t) && ((x.open >= 2 && (x.score ?? 0) < 0.8) || (x.ema !== null && x.ema < 0.6 && x.n >= 4)))
    .sort((a,b)=> b.open*(1-(b.score??0.5)) - a.open*(1-(a.score??0.5)));
}
function dueRechecks(){ const t = dayKey(); return topicStats().filter(x=>x.recheck && x.recheck <= t); }
function readiness(){
  const ts = topicStats(); const g = [...A1T, ...A2T].map(t=>{ const x = ts.find(y=>y.t===t); return x && x.score !== null ? x.score : 0.3; });
  const grammar = g.reduce((a,b)=>a+b,0)/g.length;
  const words = Math.min(1, S.words.length/2000);
  const o = S.state.out || {}; const outN = (o.chat||0) + (o.write||0)*5 + (o.sprint||0)*3;
  const output = Math.min(1, outN/400);
  const pct = Math.round((0.5*grammar + 0.25*words + 0.25*output)*100);
  const label = pct < 25 ? "A2 başlangıç" : pct < 45 ? "A2 yolunda" : pct < 65 ? "A2 sağlam" : pct < 85 ? "B1'e yaklaşıyorsun" : "B1'e hazır gibisin";
  return {pct, label, grammar:Math.round(grammar*100), words:Math.round(words*100), output:Math.round(output*100)};
}
function renderFocus(){
  const rc = dueRechecks()[0]; const wk = weakTopics()[0];
  if(rc) return `<section class="card hl"><div class="kicker">Kontrol zamanı</div><h3>${esc(rc.label)}</h3><p class="small">Bunu birkaç gün önce anlamıştın. 5 kısa soruyla gerçekten oturduğundan emin olalım.</p><button class="btn primary" data-act="recheckStart" data-t="${esc(rc.t)}">Kontrolü başlat (3 dk)</button></section>`;
  if(wk) return `<section class="card hl"><div class="kicker">Önce bunu sağlamlaştıralım</div><h3>${esc(wk.label)}</h3><p class="small">Bu konuda ${wk.open} açık hatan var${wk.ema!==null?`, son alıştırmalarda başarın %${Math.round(wk.ema*100)}`:""}. Konuyu en baştan, adım adım anlatacağım; her adımda anladığından emin olacağız.</p><div class="row"><button class="btn primary" data-act="remedStart" data-t="${esc(wk.t)}" ${aiReady()?"":"disabled"}>Takviye programını başlat (15–20 dk)</button><a class="btn small ghost" href="#seviye">Seviyem</a></div></section>`;
  return "";
}

function renderSeviye(){
  const R = readiness(); const ts = topicStats(); const rep = S.state.report;
  const t = dayKey();
  const boxes = {neu:0, lernt:0, sicher:0}; S.words.forEach(w=>{ const b = w.box||0; if(b<=1) boxes.neu++; else if(b<=3) boxes.lernt++; else boxes.sicher++; });
  const days = []; for(let i=13;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); const k = dayKey(d); days.push({k, n:Math.round(((S.state.mins||{})[k]||0)/60)}); }

  <section class="card"><details><summary>Ayarlar</summary><div class="stack" style="margin-top:10px">

    ${STANDALONE ? `<button class="btn block" data-act="goSetup">⚙️ Kurulum: anahtarlar, mikrofon, yedek</button>` : `<button class="btn block" data-act="exportAll">📦 Verilerimi yeni uygulamaya taşı (kopyala)</button>`}
    <p class="small muted">${esc(LEX.src || "")}${hasPhotos() ? " · Fotoğraflar: " + (KEYS.pex ? "Pexels" : "Pixabay") : ""}</p>
    <label class="lbl" for="sfxSel">Ses efektleri</label>
    <select id="sfxSel" data-change="sfxSel"><option value="on" ${S.state.sfxOff?"":"selected"}>Açık</option><option value="off" ${S.state.sfxOff?"selected":""}>Kapalı</option></select>
    <label class="lbl" for="immSel">Kelime kartlarında Türkçe</label>
    <select id="immSel" data-change="immSel"><option value="auto" ${S.state.vimm===undefined?"selected":""}>Basamağa göre (Kalfa'dan itibaren Türkçesiz)</option><option value="1" ${S.state.vimm===true?"selected":""}>Türkçesiz (Rosetta tarzı)</option><option value="0" ${S.state.vimm===false?"selected":""}>Türkçe göster</option></select>
    <label class="lbl" for="stageSel">Basamak (normalde uygulama önerir)</label>
    <select id="stageSel" data-change="stageSel">${[1,2,3,4].map(n=>`<option value="${n}" ${stage().n===n?"selected":""}>${n}. ${STAGES[n].name} (${STAGES[n].en})</option>`).join("")}</select>
    <label class="lbl" for="goalSel">Günlük hedef</label>
    <select id="goalSel" data-change="goalSel"><option value="0" ${!S.state.goalOverride?"selected":""}>Basamağa göre (şu an ${stage().goal} dk)</option>${[45,60,80,100,120].map(g=>`<option value="${g}" ${+S.state.goalOverride===g?"selected":""}>${g} dk</option>`).join("")}</select>

    <select id="vhsLek" data-change="vhsLek">${[0,...LEK.map(L=>L.n)].map(n=>`<option value="${n}" ${vhsLek()===n?"selected":""}>${n ? "Lektion "+n+": "+LEK[n-1].t : "Henüz başlamadı"}</option>`).join("")}</select>
    <div class="lbl">VHS ders günleri</div>
    <div class="row">${[[1,"Pzt"],[2,"Sal"],[3,"Çar"],[4,"Per"],[5,"Cum"],[6,"Cmt"]].map(([n,l])=>`<label class="chip" style="padding:6px 10px"><input type="checkbox" data-change="vhsDay" data-n="${n}" ${((S.state.vhs||{}).days||[]).includes(n)?"checked":""}> ${l}</label>`).join("")}</div>
    <label class="lbl" for="examDate">B1 sınav tarihi</label>
    <input type="date" id="examDate" value="${esc(S.state.examDate)}" data-change="examDate">
    <label class="lbl" for="setName">Adın (isteğe bağlı; karakterler sana böyle hitap eder)</label>
    <input type="text" id="setName" value="${esc(S.state.name||"")}" data-change="name" placeholder="boş bırakabilirsin">
    <label class="lbl" for="setAbout">Hakkımda (yapay zekâ örnekleri buna göre kurar)</label>
    <textarea id="setAbout" data-change="about" style="min-height:90px">${esc(S.state.about || DEFAULT_ABOUT)}</textarea>
    <p class="small muted">Bu bilgiler sadece bu sayfanın kayıtlarında durur ve sadece sana görünür.</p></div></details></section>`;
}
async function reportGen(){
  S.repBusy = true; S.repErr = ""; render();
  const ts = topicStats().map(x=>({topic:x.t, score:x.score===null?null:Math.round(x.score*100), fragen:x.n, offene_fehler:x.open}));
  const mist = S.mistakes.filter(m=>!m.mastered).sort((a,b)=>(b.count||1)-(a.count||1)).slice(0,20).map(m=>({falsch:m.wrong, richtig:m.right, thema:m.topic, mal:m.count||1}));
  const wr = S.writings.slice(0,5).map(w=>({aufgabe:w.task, fehler:w.errors, korrigiert:(w.corrected||"").slice(0,300)}));
  const days = Object.entries(S.state.days||{}).sort().slice(-14);
  try{
    const r = await askJSON(`Du bist ein erfahrener, ehrlicher Deutschlehrer. ${profile()}
DATEN DES LERNERS:
Themen (Score 0-100): ${JSON.stringify(ts)}
Offene Fehler: ${JSON.stringify(mist)}
Letzte Texte: ${JSON.stringify(wr)}
Wörter: ${S.words.length}; aktive Tage (Datum, Aktivitäten): ${JSON.stringify(days)}; Output: ${JSON.stringify(S.state.out||{})}
AUFGABE: Schreib einen ehrlichen, motivierenden Lernbericht auf Türkisch. Erkläre bei den wiederkehrenden Fehlern WARUM er sie macht (oft türkische Satzlogik oder englische Gewohnheiten). Keine erfundenen Daten.
Antworte NUR mit JSON: {"level_tr":"1 Satz: wo steht er realistisch","summary_tr":"3-4 Sätze","strengths":["…"],"patterns":[{"title_tr":"…","explain_tr":"warum er das macht und wie man denkt","example_wrong":"…","example_right":"…"}],"focus_tr":["3 konkrete Fokuspunkte für diese Woche"],"b1_tr":"2 Sätze: Abstand zu B1 und was am meisten hilft"}
Max 3 patterns.`);
    S.state.report = {...r, date: dayKey()}; Store.saveState();
  }catch(err){ S.repErr = aiMsg(err); }
  S.repBusy = false; render();
}

/* ================= Takviye (remediation) ================= */
function topicMistakes(t){ return S.mistakes.filter(m=>!m.mastered && m.topic===t).sort((a,b)=>(b.count||1)-(a.count||1)).slice(0,8); }
async function startRemed(topic, round, wrongs){
  S.ex = null; S.learn.lesson = null;
  S.remed = {topic, round: round||1, wrongs: wrongs||[], busy:true, err:"", data:null, i:0, answered:null, alt:null};
  render();
  const ms = topicMistakes(topic).map(m=>({falsch:m.wrong, richtig:m.right}));
  try{
    const r = await askJSON(`Du bist ein extrem geduldiger Deutschlehrer. ${profile()}
Der Lerner hat immer wieder Probleme mit dem Thema "${topic}" (${TL[topic]||""}). Seine Fehler dazu: ${JSON.stringify(ms)}
${round > 1 ? `Er hat es beim letzten Mal NOCH NICHT verstanden. Diese Aufgaben waren falsch: ${JSON.stringify(wrongs)}. Erkläre es diesmal ANDERS: neue Analogie, noch kleinere Schritte, andere Beispiele.` : ""}
AUFGABE: Erkläre das Thema so einfach wie für einen absoluten Anfänger, auf Türkisch, in 4-6 winzigen Schritten. Benutze Vergleiche mit dem Türkischen (warum macht ein Türke diesen Fehler?). Jeder Schritt: EINE kleine Idee, ein deutsches Beispiel aus seinem Alltag, und eine Kontrollfrage, die nur DIESEN Schritt prüft.
Antworte NUR mit JSON: {"title_tr":"…","hook_tr":"1-2 Sätze: warum er diesen Fehler macht","steps":[{"idea_tr":"…","example_de":"…","example_tr":"…","check":{"q_tr":"Frage auf Türkisch","prompt_de":"deutscher Satz mit ___ (oder leer)","options":["…","…","…"],"answer":"…","why_tr":"kurze Erklärung"}}],"golden_rule_tr":"ein einfacher Merksatz"}`);
    S.remed.data = r; S.remed.busy = false;
    (r.steps||[]).forEach(st=>{ if(st.check && st.check.options) st.check._opts = shuffle(st.check.options); });
  }catch(err){ S.remed.err = aiMsg(err); S.remed.busy = false; }
  render();
}
function renderRemed(){
  const R = S.remed;
  if(R.busy) return thinkingCard(R.round>1 ? "Konuyu bu sefer başka bir yoldan anlatmaya hazırlanıyorum…" : "Konu en baştan, adım adım hazırlanıyor…");
  if(R.err || !R.data) return `<section class="card"><div class="fb no">${esc(R.err||"Hazırlanamadı.")}</div><button class="btn" data-act="remedQuit">Geri dön</button></section>`;
  const d = R.data, steps = d.steps || [];
  if(R.i >= steps.length){
    return `
    <section class="card hl"><div class="kicker">Takviye · ${esc(TL[R.topic]||R.topic)}</div><h2>Altın kural</h2><p class="de" style="font-size:1.15rem"><b>${esc(d.golden_rule_tr||"")}</b></p><p class="small muted">Bütün adımları anladın. Şimdi farklı türde sorularla deneyelim; %80'i geçersen konu tamam.</p>
      <button class="btn primary block" data-act="remedChallenges">Challenge'lara başla</button><button class="btn ghost block" data-act="remedQuit">Sonra devam et</button></section>`;
  }
  const st = steps[R.i]; const c = st.check || {}; const a = R.answered;
  const ex = R.alt || st;
  return `
  <section class="card">
    <div class="row between"><span class="kicker">Takviye · ${esc(TL[R.topic]||R.topic)}${R.round>1?` · ${R.round}. tur`:""}</span><span class="small muted">Adım ${R.i+1}/${steps.length}</span></div>
    <div class="progress" aria-hidden="true"><i style="width:${R.i/steps.length*100}%"></i></div>
    ${R.i===0 && d.hook_tr ? `<div class="note">${esc(d.hook_tr)}</div>` : ""}
    <p style="font-size:1.05rem">${esc(ex.idea_tr)}</p>
    ${ex.example_de ? phraseRow(ex.example_de, ex.example_tr||"") : ""}
  </section>
  <section class="card">
    <div class="kicker">Anladın mı? Kontrol</div>
    <p><b>${esc(c.q_tr||"")}</b></p>
    ${c.prompt_de ? `<p class="de">${esc(c.prompt_de)}</p>` : ""}
    <div class="stack">${(c._opts||c.options||[]).map(o=>{ let cls=""; if(a){ if(norm(o)===norm(c.answer)) cls="fb ok"; else if(o===a.o) cls="fb no"; } return `<button class="btn block ${cls}" data-act="remedCheck" data-o="${esc(o)}" ${a&&a.ok?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>
    ${a ? (a.ok ? `<div class="fb ok"><b>Evet!</b> ${esc(c.why_tr||"")}</div><button class="btn primary block" data-act="remedNext">Sonraki adım</button>`
      : `<div class="fb no"><b>Olmadı, sorun değil.</b> ${esc(c.why_tr||"")}</div><div class="row"><button class="btn primary" data-act="remedAlt" ${R.altBusy?"disabled":""}>${R.altBusy?"Hazırlanıyor…":"Başka bir şekilde anlat"}</button><span class="small muted">ya da tekrar dene</span></div>`) : ""}
    <button class="btn ghost small" data-act="remedQuit">Sonra devam et</button>
  </section>`;
}
function remedCheck(o){
  const R = S.remed, c = R.data.steps[R.i].check || {};
  const ok = norm(o) === norm(c.answer);
  R.answered = {o, ok}; recordTopic(R.topic, ok); render();
}
function remedNext(){ const R = S.remed; R.i++; R.answered = null; R.alt = null; Store.saveState(); render(); }
async function remedAlt(){
  const R = S.remed, st = R.data.steps[R.i]; R.altBusy = true; render();
  try{
    const r = await askJSON(`Ein türkischer A2-Deutschlerner hat diese Erklärung NICHT verstanden: "${st.idea_tr}" (Beispiel: ${st.example_de}). Thema: ${R.topic}. Die Kontrollfrage war: ${st.check && st.check.q_tr} ${st.check && st.check.prompt_de || ""} (richtig: ${st.check && st.check.answer}).
Erkläre GENAU diese Idee noch einmal ganz anders: einfacher, mit einer Alltagsanalogie und einem Vergleich zum Türkischen. Kurz.
Antworte NUR mit JSON: {"idea_tr":"…","example_de":"…","example_tr":"…"}`, {tier:"quick"});
    R.alt = r; R.answered = null;
    if(st.check && st.check.options) st.check._opts = shuffle(st.check.options);
  }catch(err){ R.err2 = aiMsg(err); }
  R.altBusy = false; render();
}
async function remedChallenges(){
  const R = S.remed; const ms = topicMistakes(R.topic);
  S.learn.busy = true; S.learn.busyText = "Challenge'lar hazırlanıyor…"; const keep = R; S.remed = null; render();
  try{
    const r = await askJSON(`Du bist ein persönlicher Deutschlehrer. ${profile()}
Der Lerner hat gerade diese Erklärung zum Thema "${keep.topic}" gelernt: ${JSON.stringify({steps:(keep.data.steps||[]).map(s=>({idee:s.idea_tr, beispiel:s.example_de})), regel:keep.data.golden_rule_tr})}
Seine Fehler zu diesem Thema (mit id): ${JSON.stringify(ms.map(m=>({id:m.id, falsch:m.wrong, richtig:m.right})))}
AUFGABE: 10 abwechslungsreiche Challenges NUR zu diesem Thema, nur bekannte Wörter, Sätze aus seinem Alltag. Benutze ALLE Typen:
- "gap": Satz mit genau einer Lücke ___ ; "answers": alle korrekten Füllungen; "hint"
- "choice": Satz mit ___ und 3 "options"; "answer"
- "order": korrekter Satz (max 9 Wörter); nur "answer"
- "fix": "prompt" mit genau einem Fehler; "answer" korrigiert
- "produce": "prompt" ist ein türkischer Satz; "answer" ist die deutsche Übersetzung
- "tf": "prompt" ist ein deutscher Satz; "correct": true/false; "answer" ist die korrekte Version
Wenn eine Challenge einen seiner Fehler trainiert, setze "mid" auf dessen id.
Jede hat "tr" (türkisch), "explain" (1 Satz Türkisch) und "topic":"${keep.topic}".
Antworte NUR mit JSON: {"items":[…]}`);
    S.learn.busy = false;
    let items = (r && r.items) || [];
    items = items.map(x => x.kind === "tf" ? {...x, correct: x.correct === true, answer: x.answer || x.prompt} : x);
    startExercise("Takviye: " + (TL[keep.topic]||keep.topic), items, "remed", "lernen");
    if(S.ex){ S.ex.remedTopic = keep.topic; S.ex.remedRound = keep.round; }
    return;
  }catch(err){ S.learn.err = aiMsg(err); }
  S.learn.busy = false; render();
}
async function startRecheck(topic){
  S.remed = null; S.learn.busy = true; S.learn.busyText = "Kontrol soruları hazırlanıyor…"; S.ex = null; render();
  try{
    const r = await askJSON(`Du bist ein persönlicher Deutschlehrer. ${profile()}
Kurzer Kontrolltest zum Thema "${topic}", das der Lerner vor ein paar Tagen gelernt hat. 5 Aufgaben, gemischte Typen ("gap" mit "answers", "choice" mit 3 "options", "fix", "produce" (türkischer prompt → deutsche answer)), nur bekannte Wörter. Jede mit "tr", "explain" (Türkisch) und "topic":"${topic}".
Antworte NUR mit JSON: {"items":[…]}`, {tier:"quick"});
    S.learn.busy = false;
    startExercise("Kontrol: " + (TL[topic]||topic), (r && r.items) || [], "recheck", "lernen");
    if(S.ex){ S.ex.remedTopic = topic; S.ex.remedRound = 1; }
    return;
  }catch(err){ S.learn.err = aiMsg(err); }
  S.learn.busy = false; render();
}
function remedResult(e, okN){
  const t = e.remedTopic; if(!t) return;
  const pct = Math.round(okN / Math.max(1, e.results.filter(Boolean).length) * 100);
  const st = S.state.topics || (S.state.topics = {}); const s = st[t] || {r:0,w:0,ema:0.5};
  const pass = pct >= 80;
  if(e.source === "remed"){
    s.remed = {date: dayKey(), pct, rounds: e.remedRound||1};
    if(pass){ s.recheck = addDays(dayKey(), 3); s.ema = Math.max(s.ema||0, 0.75); }
  } else {
    if(pass){ s.solid = true; s.recheck = addDays(dayKey(), 14); s.ema = Math.max(s.ema||0, 0.85); }
    else { s.recheck = ""; s.solid = false; }
  }
  st[t] = s;
  e.summary.remed = {topic:t, pct, pass, recheck: pass ? s.recheck : ""};
  if(e.source === "recheck" && !pass){ e.summary.remed.pass = false; }
}

const CLK = { last: Date.now(), input: Date.now(), seen: Date.now(), saved: Date.now(), dirty:false };
["click","keydown","touchstart","scroll","input"].forEach(ev => document.addEventListener(ev, ()=>{ CLK.input = Date.now(); }, {passive:true, capture:true}));
function audioOn(){ return !!((S.audio && S.audio.playing) || (S.listen && S.listen.playing) || (S.sh && S.sh.busy)); }
function addSec(n){
  const m = S.state.mins || (S.state.mins = {}); const t = dayKey();
  const before = Math.floor((m[t]||0)/60);
  m[t] = (m[t]||0) + n; pomo().work += n; if(S.sess) S.sess.sec += n; CLK.dirty = true;
  const after = Math.floor(m[t]/60);
  if(before < DAILY_GOAL && after >= DAILY_GOAL){ const g = S.state.goalHit || (S.state.goalHit = {}); if(!g[t]){ g[t] = true; chime(); S.flash = "🎉 Bugünkü 100 dakika tamam! Bundan sonrası bonus."; if(S.sess && CTXS[S.sess.ctx].audio) say("Tebrikler! Bugünkü yüz dakika tamam.", "tr"); } }
}
function clock(){
  const now = Date.now();
  if(S.loaded && !S._boot){ S._boot = true; try { freezeCheck(); checkAch(); } catch(e){} setTimeout(()=>prefetchToday(), 1500); S._lastPre = now; }
  if(S._boot && now - (S._lastPre||0) > 3600000 && document.visibilityState === "visible"){ S._lastPre = now; prefetchToday(); } const dt = Math.min(5, (now - CLK.last)/1000); CLK.last = now;
  const vis = document.visibilityState === "visible"; const aud = audioOn();
  const paused = S.sess && S.sess.paused;
  if((vis || aud) && !paused){ if(now - CLK.seen > POMO_BREAK*60000){ pomo().work = 0; } CLK.seen = now; }
  if(S.brk){
    const left = Math.max(0, Math.round((S.brk.end - now)/1000));
    const el = $("#brkTime"); if(el) el.textContent = pad(Math.floor(left/60))+":"+pad(left%60);

  const r = $("#ringNum"); if(r) r.textContent = minsToday();
  if(CLK.dirty && now - CLK.saved > 30000){ CLK.saved = now; CLK.dirty = false; Store.saveState(); }
}

function chime(){
  try{ ACX = ACX || new (window.AudioContext||window.webkitAudioContext)();
    [660, 880].forEach((f,i)=>{ const o = ACX.createOscillator(), g = ACX.createGain(); o.frequency.value = f; o.type = "sine"; o.connect(g); g.connect(ACX.destination);
      const t0 = ACX.currentTime + i*0.22; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5); o.start(t0); o.stop(t0+0.55); });
  }catch(e){}
  try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
}

/* ---------- daha iyi sesler ---------- */
function voiceScore(v, lang){
  const n = (v.name||"")+" "+(v.voiceURI||""); let s = 0;
  if(/premium|enhanced|neural|natural|wavenet|online|gelişmiş|erweitert/i.test(n)) s += 6;
  if(/google/i.test(n)) s += 3;
  if(/siri/i.test(n)) s += 2;
  if(v.localService === false) s += 1;

function speechParts(s){

  const weak = ws.filter(w=>!due.includes(w)).sort((a,b)=>((b.wrong||0)-(b.right||0))-((a.wrong||0)-(a.right||0)));
  const items = [];
  for(const w of [...due, ...weak].slice(0, 7)){
    if(isNoun(w) && Math.random() < 0.5) items.push({kind:"artikel", prompt:w.de, answer:w.artikel, wid:w.id, tr:w.tr, explain:`${w.artikel} ${w.de}${w.plural?" · die "+w.plural:""} = ${w.tr}`, topic:"Artikel"});
    else { const m = meaningItem(w); if(m) items.push(m); else if(isNoun(w)) items.push({kind:"artikel", prompt:w.de, answer:w.artikel, wid:w.id, tr:w.tr, explain:`${w.artikel} ${w.de} = ${w.tr}`, topic:"Artikel"}); }

const SRC0 = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const SRC = SRC0;

const PRON = [
  {re:/sch/i, tip:"sch = ş: schön → şön, Tisch → tiş."},
  {re:/(^|\s)(st|sp)/i, tip:"Kelime başında st/sp = şt/şp: Straße → ştrase, sprechen → şprehen."},
  {re:/[aou]ch|auch/i, tip:"a, o, u, au'dan sonra ch gırtlaktan gelir; boğazı temizler gibi 'hh': Bach, noch, auch."},
  {re:/(ich|ech|ach(?!t)|ich|ch[ei])|(^|\s)ch/i, tip:"ich/nicht'teki ch: ne 'ş' ne 'h'. Dişlerini hafif aç, dili alt dişlere daya, 'hiii' der gibi yumuşak bir hışırtı çıkar."},
  {re:/ig(\s|[.,!?]|$)/i, tip:"Sondaki -ig = 'iç' (yumuşak ch): richtig → rihtiç, zwanzig → tsvantsiç."},
  {re:/z/i, tip:"z = ts: Zeit → tsayt, zwei → tsvay. Türkçe z gibi değil!"},
  {re:/w/i, tip:"w = Türkçe v: Wasser → vasser, wie → vi."},
  {re:/(^|\s)v/i, tip:"v çoğu kelimede f gibi: Vater → fater, viel → fil."},
  {re:/ei/i, tip:"ei = ay: mein → mayn, Arbeit → arbayt."},
  {re:/ie/i, tip:"ie = uzun i: Liebe → liibe, viel → fiil."},
  {re:/eu|äu/i, tip:"eu ve äu = oy: heute → hoyte, Häuser → hoyzer."},
  {re:/er(\s|[.,!?]|$)/i, tip:"Sondaki -er 'a'ya yakın: Lehrer → leera, aber → aaba. R'yi yuvarlama."},
  {re:/[aeiouäöü]h/i, tip:"Sesliden sonra gelen h okunmaz, sesliyi uzatır: gehen → geen, Uhr → uur."},
  {re:/(^|\s)s[aeiouäöü]/i, tip:"Sesliden önceki s = z: sagen → zaagen, Sonne → zonne."},
  {re:/ä/i, tip:"ä = Türkçe e: Mädchen → meethen, spät → şpeet."},
  {re:/qu/i, tip:"qu = kv: Quark → kvark."},
  {re:/pf/i, tip:"pf: dudakları p için kapat, f ile aç: Apfel, Kopf."},
  {re:/r/i, tip:"r: Türkçe gibi dil ucuyla titretme. Gırtlaktan, hafif hırıltılı söyle (gargara yapar gibi)."},
  {re:/j/i, tip:"j = y: ja → ya, jetzt → yetst."},
  {re:/[öü]/i, tip:"ö ve ü Türkçedeki gibi; burada avantajlısın 😊"}

function pronTips(text, n){ const out = []; for(const p of PRON){ if(p.re.test(text) && !out.includes(p.tip)) out.push(p.tip); if(out.length >= (n||3)) break; } return out; }
const NUMW = {0:"null",1:"eins",2:"zwei",3:"drei",4:"vier",5:"fünf",6:"sechs",7:"sieben",8:"acht",9:"neun",10:"zehn",11:"elf",12:"zwölf",15:"fünfzehn",20:"zwanzig",30:"dreißig",100:"hundert"};
const ntok = s => String(s||"").toLowerCase().replace(/\d+/g, d=>NUMW[d] ? " "+NUMW[d]+" " : d).replace(/ß/g,"ss").replace(/[^a-zäöü\s-]/g," ").replace(/-/g," ").split(/\s+/).filter(Boolean);
function lev(a,b){ const m = a.length, n = b.length; const d = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]); for(let j=1;j<=n;j++) d[0][j] = j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function scoreHeard(target, heard){
  const disp = String(target).split(/\s+/).filter(Boolean);
  const T = disp.map(w=>ntok(w).join(" ")); const H = ntok(heard);
  const close = (t,h) => t === h ? 2 : (t.length >= 4 && lev(t,h) <= (t.length >= 8 ? 2 : 1)) ? 1 : 0;
  const m = T.length, n = H.length; const dp = Array.from({length:m+1}, ()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--){ const c = close(T[i], H[j]); dp[i][j] = Math.max(dp[i+1][j], dp[i][j+1], c ? c + dp[i+1][j+1] : 0); }

  while(i<m && j<n){ const c = close(T[i], H[j]); if(c && dp[i][j] === c + dp[i+1][j+1]){ st[i] = c===2 ? "ok" : "near"; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  const words = disp.map((w,k)=>({w, st: T[k] ? st[k] : "ok"}));
  const sc = words.length ? words.reduce((s,x)=>s + (x.st==="ok"?1:x.st==="near"?0.5:0), 0)/words.length : 0;
  return {words, score: sc};

function shPool(){
  const pr = S.state.pron || {};
  const weak = Object.entries(pr).filter(([,v])=>(v.miss||0) >= 2 && (v.miss||0) > (v.ok||0)).map(([k])=>({de:k, tr:"", kind:"zor kelime"}));
  const ph = S.words.filter(w=>w.kind === "satz" && w.de).map(w=>({de:w.de, tr:w.tr||"", kind:"kalıp"}));
  const ms = S.mistakes.filter(m=>m.right && m.right.split(/\s+/).length <= 10).map(m=>({de:m.right, tr:"", kind:"hata defteri"}));
  const ws = S.words.filter(w=>w.kind !== "satz" && w.de && w.tr).map(w=>({de:(w.artikel?w.artikel+" ":"")+w.de, tr:w.tr, kind:"kelime"}));
  /* telaffuz analizinde sık takıldığın seslerin örnek kelimeleri öne gelir */
  const snd = Object.entries(S.state.pronSnd || {}).filter(([,v])=>v.n >= 2).sort((a,b)=>b[1].n-a[1].n).slice(0,2).flatMap(([k,v])=>(v.ex||[]).slice(-1).map(x=>({de:x, tr:"", kind:"zor ses: "+k})));
