      if(best.score >= 0.85){ await say(best.score === 1 ? "Sehr gut!" : "Gut!", "de"); if(S.sess && CTXS[S.sess.ctx].audio) setTimeout(()=>{ if(S.sh === H && H.phase === "result" && !S.sess.paused) shNext(); }, 3000); }
    }catch(e){
      if(S.sh !== H) return; H.busy = false;
      if(["not-allowed","service-not-allowed","unsupported","start","audio-capture"].includes(e.code)){ H.mic = "self"; H.err = micMsg(e.code); H.phase = "self"; }
      else { H.err = micMsg(e.code); H.phase = "result"; H.res = null; }
      render();
    }
  } else if(H.mic === "dict"){
    H.busy = false; H.phase = "dict"; H.t0 = Date.now(); render();
  } else {
    H.phase = "self"; render(); await sleep(Math.max(2500, it.de.length*90)); if(S.sh !== H || !H.busy) return;
    await say(it.de, "de"); H.busy = false; render();
  }
}
function shRecord(words){
  addXP(2);
  const pr = S.state.pron || (S.state.pron = {});
  for(const x of words){ const k = ntok(x.w).join(" "); if(!k || k.length < 3) continue; const v = pr[k] || {ok:0, miss:0}; if(x.st === "miss") v.miss++; else v.ok++; pr[k] = v; }
  Store.saveState();
}
function shNext(){
  const H = S.sh; if(!H) return; shStop();
  H.log.push({de:H.items[H.i].de, score: H.res ? H.res.score : null});
  H.i++; H.tries = 0; H.res = null; H.live = ""; H.err = "";
  if(H.i >= H.items.length){ H.phase = "done"; if(H.plan) planDone(H.plan); render(); return; }
  H.phase = "teach"; render();
  if(S.sess) setTimeout(()=>{ if(S.sh === H && H.phase === "teach") shPlay(false); }, 1800);
}
function renderShadow(){
  const H = S.sh; if(!H) return `<section class="card"><button class="btn primary block" data-act="shStart">Shadowing başlat</button></section>`;
  if(!H.items.length) return `<section class="card"><p>Shadowing için kartlarında kelime ya da kalıp yok. Önce bir ders yap.</p>${continueBtn()}</section>`;

    const sc = H.log.filter(x=>x.score!==null); const avg = sc.length ? Math.round(sc.reduce((s,x)=>s+x.score,0)/sc.length*100) : null;
    const pr = S.state.pron || {}; const weak = Object.entries(pr).filter(([,v])=>v.miss>=2 && v.miss>v.ok).map(([k])=>k).slice(0,8);
    return `<section class="card hl"><div class="kicker">Shadowing bitti</div><div class="big">${avg!==null ? "%"+avg : "✓"}</div>

      ${weak.length ? `<p>Zorlandığın kelimeler (bir sonraki shadowing'de ilk bunlar gelir): <span class="de"><b>${weak.map(esc).join(", ")}</b></span></p>` : ""}

  }
  const it = H.items[H.i]; const tips = pronTips(H.res ? H.res.words.filter(x=>x.st!=="ok").map(x=>x.w).join(" ") || it.de : it.de, 3);

    <p class="de" style="font-size:1.5rem;line-height:1.5">${r ? r.words.map(x=>`<span class="pw ${x.st}">${esc(x.w)}</span>`).join(" ") : `<b>${esc(it.de)}</b>`}</p>
    ${it.tr ? `<p class="tr">${esc(it.tr)}</p>` : ""}
    ${tips.length ? `<div class="stack small">${tips.map(t=>`<div class="ex">🗣️ ${esc(t)}</div>`).join("")}</div>` : ""}
    ${H.phase==="listen" ? `<div class="thinking"><span class="spin"></span>Dinle…</div>` : ""}
    ${H.phase==="rec" ? `<div class="fb ok" style="text-align:center"><b>🎤 Şimdi sen söyle!</b><div class="small" id="shLive">${esc(H.live)}</div></div>` : ""}
    ${H.phase==="self" && H.busy ? `<div class="fb ok" style="text-align:center"><b>🎤 Şimdi sen söyle!</b> <span class="small">Sonra tekrar duyacaksın.</span></div>` : ""}
    ${H.phase==="dict" ? `<div class="fb ok"><b>🎤 Şimdi söyle:</b> kutuya dokun, klavyedeki mikrofon tuşuna bas ve cümleyi Almanca söyle (klavye dili Deutsch olmalı). Telefonun yazıya döker; uygulama hangi kelimelerin anlaşıldığını gösterir.</div>
      <textarea id="shDict" style="min-height:56px" placeholder="Buraya söyle…" autocapitalize="sentences"></textarea>
      <button class="btn primary block" data-act="shDictCheck">Kontrol et</button>` : ""}
    ${H.err ? `<div class="note">${esc(H.err)}</div>` : ""}
    ${r ? `<div class="fb ${r.score>=0.85?"ok":"no"}"><b>%${Math.round(r.score*100)}</b> ${r.score>=0.85 ? "Çok iyi!" : r.score>=0.6 ? "Yaklaştın. Kırmızı kelimelere dokun, yavaşça dinle, tekrar dene." : "Bir daha deneyelim: önce yavaş dinle."}<div class="small muted">Duyduğum: „${esc(r.heard)}“</div></div>` : ""}
    ${r && r.words.some(x=>x.st!=="ok") ? `<div class="row">${r.words.filter(x=>x.st!=="ok").map(x=>`<button class="btn small" data-act="shWord" data-w="${esc(x.w)}">🔊 ${esc(x.w)}</button>`).join("")}</div>` : ""}

/* yanlış söylediysen: doğrusunu duy, bir kez doğru söyle, sonra sohbet devam eder (en çok 2 deneme) */
async function rpRepeat(me){
  const T = S.talk; const halt = () => S.talk !== T || T.ended || (S.sess && S.sess.paused);
  T.rep = {text: me.better, tries:0, ok:null, live:""}; render();
  await say("Besser so:", "de", 1.0); if(halt()) return false;
  await say(me.better, "de", deRate()*0.9); if(halt()) return false;
  if(T.mic === "sr"){
    for(let k = 0; k < 2; k++){
      T.rep.tries = k + 1; T.rep.live = ""; T.rep.listening = true; render();
      let alts = [];
      try { alts = await recognize(txt => { T.rep.live = txt; const el = $("#rpRepLive"); if(el) el.textContent = txt; }); } catch(e){ alts = []; }
      T.rep.listening = false; if(halt()) return false;
      const best = alts.length ? Math.max(...alts.map(x=>scoreHeard(me.better, x).score)) : 0;
      if(best >= 0.8){ T.rep.ok = true; render(); sfx("ok"); await say("Genau!", "de", 1.0); if(halt()) return false; break; }
      T.rep.ok = false; render();
      if(k === 0){ await say("Noch einmal:", "de", 1.0); if(halt()) return false; await say(me.better, "de", deRate()*0.8); if(halt()) return false; }
    }
  } else {
    T.rep.self = true; render();
    await sleep(Math.max(3500, me.better.length * 120)); if(halt()) return false;
  }
  await sleep(400); T.rep = null; render();
  return !halt();
}

  let first = 0;
  try{
    const alts = await recognize(txt => { if(!first){ first = Date.now(); } T.live = txt; const el = $("#rpLive"); if(el) el.textContent = txt; });
    T.listening = false;
    if(S.talk !== T || (S.sess && S.sess.paused)) return;

  }
}

function rpStats(T){
  const lat = T.lat || []; const sorted = [...lat].sort((a,b)=>a-b);
  return { n: lat.length, med: sorted.length ? sorted[Math.floor(sorted.length/2)] : null, fast: lat.length ? Math.round(lat.filter(x=>x<=5).length/lat.length*100) : null };
}
function rpLog(T){
  const s = rpStats(T); const log = S.state.speakLog || (S.state.speakLog = []);
  log.push({date: dayKey(), lvl:T.level, pid:T.pid, n: T.msgs.filter(m=>m.who==="a").length, med: s.med, fast: s.fast, peeks: T.peeks||0, repairs: T.repairs||0});
  S.state.speakLog = log.slice(-120); Store.saveState();
}

function startContinuous(onText){
  let stopped = false, rec = null, finals = "";
  const run = () => {
    if(stopped) return;
    try { rec = new SRC(); } catch(e){ return; }
    rec.lang = "de-DE"; rec.continuous = true; rec.interimResults = true;
    let base = finals;
    rec.onresult = e => { let fin = "", live = ""; for(let i=0;i<e.results.length;i++){ if(e.results[i].isFinal) fin += e.results[i][0].transcript + " "; else live += e.results[i][0].transcript + " "; } finals = (base + " " + fin).trim(); onText(finals, live.trim()); };
    rec.onerror = e => { if(e.error === "not-allowed" || e.error === "service-not-allowed"){ stopped = true; onText(finals, "", e.error); } };
    rec.onend = () => { if(!stopped) setTimeout(run, 150); };
    try { rec.start(); } catch(e){}
  };
  run();
  return () => { stopped = true; try { rec && rec.stop(); } catch(e){} return finals; };
}

/* ---------- yeni seviye hesabı: dinleme ve konuşma dahil ---------- */
readiness = function(){
  const ts = topicStats(); const g = [...A1T, ...A2T].map(t=>{ const x = ts.find(y=>y.t===t); return x && x.score !== null ? x.score : 0.3; });
  const grammar = g.reduce((a,b)=>a+b,0)/g.length;
  const solid = S.words.filter(w=>(w.box||0)>=3).length; const words = Math.min(1, solid/1500);
  const cs = S.state.checks || []; const lastC = cs[cs.length-1];
  const dl = (S.state.dictLog||[]).slice(-10).map(x=>x.pct);
  const dictPct = lastC && lastC.dict!=null ? lastC.dict : dl.length ? dl.reduce((a,b)=>a+b,0)/dl.length : null;
  const listen = dictPct===null ? null : Math.min(1, dictPct/90);
  const fl = (S.state.fluLog||[]).slice(-5).flatMap(x=>x.wpm||[]).filter(x=>x!=null);
  const wpm = lastC && lastC.wpm!=null ? lastC.wpm : fl.length ? Math.max(...fl) : null;
  const lat = lastLat(30);
  const sp = [wpm!==null ? Math.min(1, wpm/90) : null, lat!==null ? Math.max(0, Math.min(1, (8-lat)/6)) : null].filter(x=>x!==null);
  const speak = sp.length ? sp.reduce((a,b)=>a+b,0)/sp.length : null;
  const pct = Math.round((0.3*grammar + 0.2*words + 0.25*(listen||0) + 0.25*(speak||0))*100);
  const label = pct < 25 ? "A2 başlangıç" : pct < 45 ? "A2 yolunda" : pct < 65 ? "A2 sağlam" : pct < 85 ? "B1'e yaklaşıyorsun" : "B1'e hazır gibisin";
  return {pct, label, grammar:Math.round(grammar*100), words:Math.round(words*100), output: speak===null ? null : Math.round(speak*100), listen: listen===null ? null : Math.round(listen*100), wpm, lat};
};

/* ---------- soru işareti düzeltmesi ---------- */
function qfix(de, tr){
  tr = String(tr||""); if(!tr) return tr;
  const isQde = /\?\s*$/.test(String(de||""));
  const isQtr = /(\s|^)m[ıiuü](\w*)\s*[.!]?\s*$/i.test(tr) || /\b(ne|nasıl|neden|nerede|nereye|kim|hangi|kaç|ne zaman)\b[^.?!]*[.]?\s*$/i.test(tr) && isQde;
  if((isQde || isQtr) && !/\?\s*$/.test(tr)) tr = tr.replace(/[.!\s]+$/,"") + "?";
  return tr;
}

function sessPause(){
  const s = S.sess; if(!s || s.paused) return;
  const P = {view: S.view, at: Date.now()};
  if(S.audio && S.audio.playing){ P.audio = true; }
  if(S.listen && S.listen.playing){ P.listen = true; }
  if(S.game && S.game.type === "blitz" && !S.game.over){ P.blitz = Math.max(1, Math.ceil((S.game.end - Date.now())/1000)); clearInterval(S.blitzIv); }
  if(S.flu && S.flu.phase === "run"){ fluStop(); }
  const rd = stopReading(); if(rd) P.read = rd;
  if(S.sh && S.sh.busy) P.sh = true;
  const T = S.talk; if(T && T.voice && T.started && !T.ended && (T.speaking || T.listening || T.busy)) P.talk = true;
  stopSpeech(); audioStop(); shStop(); micAbort();
  if(T){ T.listening = false; T.speaking = false; }
  s.paused = P; Store.saveState(); go("seans"); render();
}
function sessUnpause(){
  const s = S.sess; if(!s || !s.paused) return false;
  const P = s.paused; s.paused = null; primeTTS();
  if(CTXS[s.ctx].audio) wakeOn();

function vSchedule(w, g){
  const t = dayKey(); let ivl = w.ivl || 0, ease = w.ease || 2.5, reps = vReps(w), lapses = w.lapses || 0, due;
  if(g === 0){ lapses++; reps = 0; ivl = 0; ease = Math.max(1.3, ease - 0.2); due = t; }
  else {
    if(reps === 0) ivl = g === 3 ? 3 : 1;
    else if(reps === 1) ivl = g === 1 ? 2 : g === 3 ? 6 : 3;
    else ivl = Math.round(Math.max(ivl, 1) * (g === 1 ? 1.2 : g === 3 ? ease * 1.3 : ease));
    ease = Math.min(3.0, Math.max(1.3, ease + (g === 1 ? -0.15 : g === 3 ? 0.1 : 0)));
    reps++; ivl = Math.min(ivl, 365); due = addDays(t, ivl);
  }
  const box = ivl >= 60 ? 6 : ivl >= 30 ? 5 : ivl >= 14 ? 4 : ivl >= 7 ? 3 : ivl >= 3 ? 2 : ivl >= 1 ? 1 : 0;
  return {ivl, ease, reps, lapses, due, box};
}

function vCleanSent(s, de){

function todayWords(){
  const t = dayKey(), d3 = addDays(t, -3);
  const cards = S.words.filter(vIsCard);
  const fresh = cards.filter(w=>w.intro && w.intro >= d3);
  const due = cards.filter(w=>vDue(w)).slice(0, 15);
  const weak = cards.filter(w=>(w.lapses||0) >= 2).slice(0, 5);
  const all = [...fresh, ...due, ...weak].filter((w,i,a)=>a.indexOf(w) === i).slice(0, 28);
  return all;
}
const wLabel = w => (w.artikel ? w.artikel+" " : "") + w.de;
const _profile3 = profile;
profile = function(){
  const tw = todayWords().map(wLabel);

WÖRTER DES TAGES (gerade gelernt oder zu wiederholen; benutze sie so oft und natürlich wie möglich, in neuen Situationen, damit er sie in echten Kontexten wieder trifft): ${tw.join(", ") || "-"}

/* ---------- aktif kullanım: kelimeyi kendi cümlende kullandın mı? ---------- */
function wordForms(w){
  const d = String(w.de||"").toLowerCase().replace(/^sich /,""); const f = new Set([d]);
  if(w.plural && w.plural !== "-") f.add(String(w.plural).toLowerCase());
  if(w.kind === "verb" && d.endsWith("en")) { const st = d.slice(0,-2); ["e","st","t","en","te","ten","test","tet"].forEach(x=>f.add(st+x)); f.add("ge"+st+"t"); }
  if(w.kind === "verb" && d.endsWith("n") && !d.endsWith("en")) { const st = d.slice(0,-1); ["e","st","t"].forEach(x=>f.add(st+x)); }
  if(w.kind === "adj") ["e","er","es","en","em"].forEach(x=>f.add(d+x));
  if(w.kind === "nomen") ["n","en","s","es","e"].forEach(x=>f.add(d+x));
  return f;
}
async function markUsed(text, where){
  const toks = new Set(String(text||"").toLowerCase().replace(/[^a-zäöüß\s-]/g," ").split(/\s+/).filter(t=>t.length>2));
  if(!toks.size) return 0;
  const hits = [];
  for(const w of S.words){ if(!vIsCard(w)) continue; const fs = wordForms(w); for(const f of fs){ if(toks.has(f)){ hits.push(w); break; } } if(hits.length >= 12) break; }
  for(const w of hits) await Store.put("words", {...w, used:(w.used||0)+1, lastUsed:dayKey(), usedIn:[...new Set([...(w.usedIn||[]), where])].slice(-6)});
  if(hits.length){ const d = daily(); d.used = (d.used||0) + hits.length; Store.saveState(); }
  return hits.length;
}
function activeCount(){ return S.words.filter(w=>vIsCard(w) && (w.used||0) >= 2).length; }

/* --- sesler (kapatılabilir) --- */
function sfx(kind){
  if(S.state.sfxOff) return;
  try{ ACX = ACX || new (window.AudioContext||window.webkitAudioContext)(); if(ACX.state === "suspended") ACX.resume();
    const seq = kind === "ok" ? [[784,0],[1046,0.09]] : kind === "no" ? [[220,0],[196,0.12]] : kind === "combo" ? [[659,0],[784,0.07],[988,0.14]] : kind === "up" ? [[523,0],[659,0.1],[784,0.2],[1046,0.3]] : kind === "chest" ? [[392,0],[523,0.12],[659,0.24],[784,0.36],[1046,0.5]] : [[880,0]];
    seq.forEach(([f,t])=>{ const o = ACX.createOscillator(), g = ACX.createGain(); o.type = kind === "no" ? "triangle" : "sine"; o.frequency.value = f; o.connect(g); g.connect(ACX.destination);
      const t0 = ACX.currentTime + t; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(kind === "no" ? 0.12 : 0.18, t0+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.22); o.start(t0); o.stop(t0+0.25); });
  }catch(e){}
}

/* --- konfeti ve tost --- */
function confetti(n){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const W = c.width = innerWidth, H = c.height = innerHeight; const x = c.getContext("2d");
  const cols = ["#E0B36E","#8FB4C9","#E08E85","#8CC79A","#C9A0DC","#F2D16B"];
  const P = Array.from({length:n||110}, ()=>({x:W/2 + (Math.random()-0.5)*W*0.3, y:H*0.35, vx:(Math.random()-0.5)*9, vy:-Math.random()*10-4, r:Math.random()*6+3, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, s:(Math.random()-0.5)*0.3}));
  let t = 0; const step = () => { t++; x.clearRect(0,0,W,H);
    for(const p of P){ p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.a += p.s; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - t/95); x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }
    if(t < 95) requestAnimationFrame(step); else c.remove(); };
  requestAnimationFrame(step);
}
function toast(html, ms){
  const d = document.createElement("div"); d.className = "toast"; d.innerHTML = html; document.body.appendChild(d);
  requestAnimationFrame(()=>d.classList.add("in")); setTimeout(()=>{ d.classList.remove("in"); setTimeout(()=>d.remove(), 350); }, ms || 1800);
}
function bigCelebrate(title, sub, mood){
  const d = document.createElement("div"); d.className = "celebrate";
  d.innerHTML = `<div class="cbox">${brezi(mood||"party", 96)}<h2>${title}</h2><p>${sub||""}</p><button class="btn primary block" data-close="1">Weiter!</button></div>`;
  d.addEventListener("click", e=>{ if(e.target.dataset.close || e.target === d) d.remove(); });
  document.body.appendChild(d); confetti(140); sfx("up");
}

function xpState(){ return S.state.xp || (S.state.xp = {total:0, days:{}}); }

function xpGoal(){ return [0, 60, 90, 120, 150][stage().n]; }
function lvlOf(total){ let l = 1, need = 120, acc = 0; while(total >= acc + need){ acc += need; l++; need = Math.round(need * 1.18); } return {l, into: total - acc, need}; }
function addXP(n, why){
  if(!n) return; const X = xpState(); const t = dayKey(); const before = lvlOf(X.total).l; const beforeDay = X.days[t] || 0;
  X.total += n; X.days[t] = beforeDay + n;

  const el = document.createElement("div"); el.className = "xpfloat"; el.textContent = "+" + n + " XP"; document.body.appendChild(el); setTimeout(()=>el.remove(), 1300);
  if(after > before) setTimeout(()=>bigCelebrate(`Seviye ${after}! ⭐`, "Harika gidiyorsun. Her seviye bir adım daha konuşmaya yakın.", "party"), 400);
  if(beforeDay < xpGoal() && X.days[t] >= xpGoal()) setTimeout(()=>{ toast(`${brezi("party",36)}<b>Günlük XP hedefi tamam!</b>`, 2600); confetti(80); sfx("up"); }, 300);

  const a = pool[seed % pool.length], b = pool[(seed*7+3) % pool.length];
  const list = [QUESTS[0], a, b !== a ? b : pool[(seed+1) % pool.length], ...(new Date().getHours() >= 17 ? [QUESTS[5]] : [])];
  return list.slice(0, 3).map(q=>({...q, v: Math.min(q.goal, q.get(daily()))}));

async function sayMixed(text){ for(const c of chunksOf({lang:"tr", text})){ await say(c.text, c.lang); } }
async function denkRun(){
  const D = S.denk; if(!D || !D.data) return; primeTTS();
  D.playing = true; const run = (D.run = (D.run||0)+1); const alive = () => S.denk === D && D.run === run && D.playing;
  while(alive() && D.i < D.data.steps.length){
    const st = D.data.steps[D.i];
    if(D.phase === "say"){ render(); await sayMixed(st.say); if(!alive()) return; D.phase = "ask"; }
    if(D.phase === "ask"){ render(); await say(st.ask, "tr"); if(!alive()) return;
      if(!D.auto){ D.playing = false; render(); return; }
      await sleep(Math.max(5000, st.ans.length*140)); if(!alive()) return; D.phase = "ans"; }
    if(D.phase === "ans"){ render(); await say(st.ans, "de"); if(!alive()) return; await sleep(600); await sayMixed(st.why); if(!alive()) return; await sleep(500); await say(st.ans, "de", deRate()*0.9); if(!alive()) return; await sleep(1200);
      D.i++; D.phase = "say"; addXP(1); }
  }
  if(alive() && D.i >= D.data.steps.length) denkFinish();
}
function denkFinish(){
  const D = S.denk; D.playing = false; D.finished = true;
  const st = S.state.denk || (S.state.denk = {n:0, sum:[]}); st.n++; st.sum = [...(st.sum||[]), D.data.summary||""].slice(-12);

}

const IDB = {

  async get(k){ const db = await this.open(); return new Promise((res, rej)=>{ const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  async set(k, v){ const db = await this.open(); return new Promise((res, rej)=>{ const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};

function rankModel(list, lite){
  const ok = list.filter(n=>/gemini/i.test(n) && /flash/i.test(n) && !/image|tts|audio|live|embed|vision|8b/i.test(n));
  const pref = ok.filter(n=> lite ? /lite/i.test(n) : !/lite/i.test(n));
  const pool = pref.length ? pref : ok.length ? ok : list;
  const ver = n => { const m = n.match(/gemini-(\d+(?:\.\d+)?)/i); return m ? parseFloat(m[1]) : 0; };
  return pool.slice().sort((a,b)=> ver(b) - ver(a) || (/preview|exp/i.test(a) ? 1 : 0) - (/preview|exp/i.test(b) ? 1 : 0) || a.length - b.length)[0];

function parseJSONLoose(t){

}

async function gemCall(model, body, signal){

/* ---------- FSRS-5 (Anki'nin yeni algoritması) ---------- */
const FSRS_W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
const F_DECAY = -0.5, F_FACTOR = 19/81, F_RET = 0.9;
const clampD = d => Math.min(10, Math.max(1, d));
function fsrsInitD(g){ return clampD(FSRS_W[4] - Math.exp(FSRS_W[5]*(g-1)) + 1); }
function fsrsR(t, s){ return Math.pow(1 + F_FACTOR * t / s, F_DECAY); }
function fsrsIvl(s){ return Math.max(1, Math.min(365, Math.round(s / F_FACTOR * (Math.pow(F_RET, 1/F_DECAY) - 1)))); }
vSchedule = function(w, g){
  const G = g + 1; const t = dayKey(); const W = FSRS_W;
  let fs = w.fs;
  if(!fs){ const reps0 = vReps(w); fs = reps0 > 0 ? {s: Math.max(1, w.ivl || INTERVALS[Math.min(6, w.box||1)] || 1), d:5, last: w.lastRev || addDays(t, -Math.max(1, w.ivl||1))} : null; }
  let s, d;
  if(!fs){ s = W[G-1]; d = fsrsInitD(G); }
  else {
    const el = Math.max(0, Math.round((new Date(t+"T12:00:00") - new Date((fs.last||t)+"T12:00:00"))/86400000));
    const R = fsrsR(el, fs.s);
    d = clampD(W[7]*fsrsInitD(4) + (1-W[7])*(fs.d + (-W[6]*(G-3))*(10-fs.d)/9));
    if(G === 1) s = Math.min(fs.s, W[11] * Math.pow(d, -W[12]) * (Math.pow(fs.s+1, W[13]) - 1) * Math.exp(W[14]*(1-R)));
    else if(el === 0) s = fs.s * Math.exp(W[17] * (G - 3 + W[18]));
    else s = fs.s * (Math.exp(W[8]) * (11-d) * Math.pow(fs.s, -W[9]) * (Math.exp(W[10]*(1-R)) - 1) * (G === 2 ? W[15] : 1) * (G === 4 ? W[16] : 1) + 1);
  }
  s = Math.max(0.1, s);
  const ivl = G === 1 ? 0 : fsrsIvl(s);
  const reps = G === 1 ? 0 : vReps(w) + 1;
  const box = ivl >= 60 ? 6 : ivl >= 30 ? 5 : ivl >= 14 ? 4 : ivl >= 7 ? 3 : ivl >= 3 ? 2 : ivl >= 1 ? 1 : 0;
  return {ivl, ease: w.ease || 2.5, reps, lapses: (w.lapses||0) + (G === 1 ? 1 : 0), due: G === 1 ? t : addDays(t, ivl), box, fs:{s, d, last:t}, lastRev:t};
};

const GLOSS = {};
function wordAt(x, y){

function renderWordPop(){
  let el = document.querySelector(".wpop-wrap"); const P = S.wpop;
  if(!P){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement("div"); el.className = "wpop-wrap"; document.body.appendChild(el); el.addEventListener("click", ev=>{ if(ev.target === el) closeWordPop(); }); }
  const g = P.g ? nounFix({de:P.g.lemma, artikel:P.g.artikel, plural:P.g.plural, kind:P.g.type === "nomen" ? "nomen" : P.g.type}) : null;
  const k = P.known; const taps = (S.state.taps||{})[P.word] || 0;
  el.innerHTML = `<div class="wpop">
    <div class="row between"><div><span class="de" style="font-size:1.4rem"><b>${g && g.artikel ? `<span class="art ${artCls(g.artikel)}">${esc(g.artikel)}</span> ` : ""}${esc(g ? g.de : P.word)}</b></span>${g && g.plural && g.plural !== "-" ? ` <span class="small muted">· die ${esc(g.plural)}</span>` : ""}</div><button class="btn small ghost" data-wp="close">✕</button></div>
    ${P.busy ? `<div class="thinking"><span class="spin"></span>Anlamına bakılıyor…</div>` : ""}
    ${k ? `<p><b>${esc(k.tr)}</b></p><p class="small muted">Bu kelime zaten destende ✓${k.used ? ` · ${k.used} kez kullandın` : ""}</p>` : P.g ? `<p><b>${esc(P.g.tr)}</b></p>${P.g.note ? `<p class="small muted">${esc(P.g.note)}</p>` : ""}` : P.err ? `<div class="fb no">${esc(P.err)}</div>` : ""}
    ${P.sent ? `<div class="ex small"><span class="de">${esc(P.sent)}</span></div>` : ""}
    <div class="row"><button class="btn small" data-wp="say">🔊</button><button class="btn small" data-wp="slow">🐢</button>
      ${!k && P.g ? (P.added ? `<span class="chip good">✓ Destene eklendi: önce öğretilecek, sonra farklı cümlelerle gelecek</span>` : `<button class="btn small primary" data-wp="add">➕ Öğrenmek istiyorum</button>`) : ""}</div>
    ${!k && P.g && !P.added && taps >= 2 ? `<p class="small" style="color:var(--warn)">Bu kelimeye ${taps}. kez bakıyorsun: destene ekleyelim mi?</p>` : ""}
  </div>`;
  el.querySelectorAll("[data-wp]").forEach(b=>b.onclick = ev=>{ ev.stopPropagation(); const a = b.dataset.wp;
    if(a === "close") closeWordPop(); else if(a === "say"){ holdReading(); say(g ? (g.artikel ? g.artikel+" " : "")+g.de : P.word, "de"); } else if(a === "slow") saySlow(P.word); else if(a === "add") wordPopAdd(); });
}
function closeWordPop(){ S.wpop = null; renderWordPop(); }
async function wordPopAdd(){
  const P = S.wpop; if(!P || !P.g) return; const g = P.g;
  const ctxS = P.sent && P.sent.includes(P.word) ? {de:P.sent, answer:P.word, tr:"", trw:"", scene:[], bg:"day", img:g.img||"", d:dayKey()} : null;
  await addWords([{de:g.lemma, artikel:g.artikel, plural:g.plural, tr:g.tr, note:g.note, kind: g.type === "nomen" ? "nomen" : g.type === "verb" ? "verb" : g.type === "adj" ? "adj" : "andere"}]);
  const w = S.words.find(x=>norm(x.de) === norm(g.lemma)); if(w){ await Store.put("words", {...w, src:"tap", met: P.sent || "", sents: ctxS ? [ctxS] : (w.sents||[])}); }

}

document.addEventListener("input", e => {
  const m = e.target.dataset && e.target.dataset.model; if(!m) return;
  const v = e.target.value;
  if(m === "exUser") S.ex.user = v;
  else if(m === "writeText"){ S.write.text = v; const c = $("#sentCount"); if(c) c.textContent = sentenceCount(v) + " cümle"; }
  else if(m === "scen") S.talk.scen = v;
  else if(m === "chatIn"){ S.talk.input = v; const T = S.talk; if(T.voice && T.waitStart && !T._typed){ T._typed = true; T.lat = T.lat || []; T.lat.push((Date.now() - T.waitStart)/1000); } }
  else if(m === "vUser") S.voc.user = v;
  else if(m === "sit") S.speak.sit = v;
  else if(m === "sprintAns") S.speak.sprint.cur = v;
  else if(m === "fill") S.kartei.fill = v;
  else if(m === "impText") S.kartei.impText = v;
  else if(m === "search"){ S.kartei.search = v; clearTimeout(window._st); window._st = setTimeout(()=>{ render(); const s=$("#wsearch"); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length);} }, 300); }
});
document.addEventListener("change", e => {
  const c = e.target.dataset && e.target.dataset.change; if(!c) return;
  if(c === "step"){ const w = weeks().find(x=>x.n===+e.target.dataset.w); const d = w && w.days.find(x=>x.n===+e.target.dataset.d); if(w && d){ setStep(w, d, e.target.dataset.id, e.target.checked); render(); } }
  else if(c === "mission"){ const m = S.state.missions || (S.state.missions = {}); const t = dayKey(); if(e.target.checked && !m[t]){ addXP(30); bigCelebrate("Gerçek Almanca! 🌍", "Bugün gerçek bir insanla Almanca konuştun. Uygulamanın asıl amacı bu.", "party"); }
    if(e.target.checked){ m[t] = true; const d = S.state.days || (S.state.days = {}); const dd = d[t] || {n:0}; dd.n = (dd.n||0)+1; d[t] = dd; } else delete m[t]; Store.saveState(); render(); }
  else if(c === "name"){ S.state.name = e.target.value.trim(); Store.saveState(); }
  else if(c === "about"){ S.state.about = e.target.value.trim(); Store.saveState(); }
  else if(c === "gemMode"){ S.state.gemMode = e.target.value; Store.saveState(); }
  else if(c === "sfxSel"){ S.state.sfxOff = e.target.value === "off"; Store.saveState(); }
  else if(c === "immSel"){ const v = e.target.value; if(v === "auto") delete S.state.vimm; else S.state.vimm = v === "1"; Store.saveState(); }
  else if(c === "themeSel"){ const v = e.target.value; S.state.themeNight = v === "night"; S.state.theme = v === "night" ? "auto" : v; Store.saveState(); render(); }
  else if(c === "vhsDay"){ const v = S.state.vhs || (S.state.vhs = {}); const n = +e.target.dataset.n; v.days = (v.days||[]).filter(x=>x!==n); if(e.target.checked) v.days.push(n); Store.saveState(); }
  else if(c === "stageSel"){ S.state.stage = +e.target.value; Store.saveState(); render(); }
  else if(c === "goalSel"){ S.state.goalOverride = +e.target.value || 0; Store.saveState(); render(); }
  else if(c === "vhsLek"){ S.state.vhs = {...(S.state.vhs||{}), lek: +e.target.value, asked: dayKey()}; Store.saveState(); }
  else if(c === "voiceDe" || c === "voiceTr"){ const v = S.state.voice || (S.state.voice = {}); v[c==="voiceDe"?"de":"tr"] = e.target.value; Store.saveState(); }
  else if(c === "voiceRate"){ const v = S.state.voice || (S.state.voice = {}); v.rate = +e.target.value; Store.saveState(); }
  else if(c === "examDate"){ S.state.examDate = e.target.value; Store.saveState(); renderTop(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "vIn"){ e.preventDefault(); S.voc.user = e.target.value; if(!S.voc.res) vCheck(); else if(!S.voc.needArt) vNext(); return; }
  if(e.key === "Enter" && e.target.id === "exInput"){ e.preventDefault(); const ex = S.ex; if(!ex) return; if(ex.checked) ACT.exNext(); else { ex.user = e.target.value; exCheck(); } }
});
window.addEventListener("hashchange", route);

Object.assign(ACT, {
  paStart(b){ const t = (b && b.dataset && b.dataset.t) || (S.sh && S.sh.items[S.sh.i] && S.sh.items[S.sh.i].de); if(t) paStart(t); },
  storyRA(){ if(S.story){ stopReading(); stopSpeech(); S.story.ra = 0; render(); } },
  storyRANext(){ const H = S.story; if(!H || H.ra == null) return; H.ra++; addXP(1); if(H.ra >= H.data.sentences.length){ daily().readAloud = true; addXP(5); Store.saveState(); } render(); },
  paStop(){ paStop(); },
  paCancel(){ paCancel(); }
});
route();
initRuntime();
</script>
