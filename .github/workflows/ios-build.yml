name: Build Unsigned iOS IPA

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          for item in index.html manifest.webmanifest apple-touch-icon.png favicon.png icon-192.png icon-512.png robots.txt data; do
            if [ -e "$item" ]; then cp -r "$item" www/; fi
          done

      - name: Initialize Capacitor and Add iOS
        run: |
          npx cap init "Deutsch Werkstatt" "com.mutemadiyenn.deutschwerkstatt" --web-dir=www
          
          # CocoaPods otomatik kurulumunu atla
          CAPACITOR_SKIP_POD_INSTALL=1 npx cap add ios
          
          # Perl kullanarak iOS sürümünü zorla 15.0 yap (Ne yazarsa yazsın bulur ve değiştirir)
          perl -pi -e "s/platform :ios, .*/platform :ios, '15.0'/" ios/App/Podfile
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          
          # Şimdi paketleri güvenle yükle
          npx cap sync ios

      - name: Add Microphone Permission
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Mikrofon izni gerekli.'" ios/App/App/Info.plist

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          
      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: App.ipa
