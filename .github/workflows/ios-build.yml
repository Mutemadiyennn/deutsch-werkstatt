name: Build Unsigned iOS IPA

# Uygulama, yayındaki sayfayı (GitHub Pages) açan bir iPhone kabuğu. Bu yüzden
# uygulamadaki her güncelleme kendiliğinden gelir; IPA'yı sadece bu dosya
# (kabuk ayarları) değişince yeniden kurman gerekir.

on:
  workflow_dispatch:
  # PM-071: kabuk değişikliği PR'da derlenir (kırmızıysa birleşmez); IPA yapıt olarak iner
  pull_request:
    paths: [".github/workflows/ios-build.yml"]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          # Kabuk 1.6 (PM-142 md. 2.1): ana sürüm sabit (8); yeni bir ana sürüm sessizce gelip eklentileri kırmasın
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/ios@^8
          # Yerel eklentiler: klavyedeki ^ v ✓ çubuğunu gizleme, doğru/yanlışta titreşim
          npm install @capacitor/keyboard@^8 @capacitor/haptics@^8 @capacitor/status-bar@^8 @capacitor/local-notifications@^8 @capacitor/app@^8 @capawesome/capacitor-badge@^8 @capacitor/share@^8
          # Apple'ın cihaz üstü konuşma tanıma (topluluk eklentisi). PM-071 1. adım: kurulamaz ya da derlenmezse iş kırmızı; sessizce çıkarılmaz.
          # Kabuk 1.6 (PM-137 eki): sürüm sabit 7.0.1 (son sürüm; @capacitor/core >=7 ister, 8 ile uyumlu). Hata metni iOS'un
          # yerelleştirilmiş açıklamasıdır (Almanca arayüzde Almanca); uygulama ham metni Ben → Tanılama'da gösterir.
          npm install @capacitor-community/speech-recognition@7.0.1
          # Mikrofon kaydı uygulamanın içinde (iPhone'un kendi kaydedicisi; web görünümünün mikrofon hatalarına takılmaz)
          npm install @independo/capacitor-voice-recorder@^8
          # Kabuk 1.5 (PM 7042267632): iPhone'un kendi seslendirmesi (AVSpeechSynthesizer). Web görünümü yüklü premium/gelişmiş
          # sesleri vermiyor; bu eklenti hepsini listeler, gerçek hızla ve perdesiz okur. Sürüm sabit; kurulamazsa iş kırmızı.
          npm install @capacitor-community/text-to-speech@8.0.0

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          for item in index.html manifest.webmanifest apple-touch-icon.png favicon.png icon-192.png icon-512.png robots.txt data; do
            if [ -e "$item" ]; then cp -r "$item" www/; fi
          done
          # İnternet yokken açılışta gösterilecek sayfa. Kabuk 1.6 (PM-128): "Tekrar dene" doğrudan v2'yi açar (kök sayfadaki
          # yönlendirme kabukta ana çerçeve gezinmesini iptal edip bu sayfaya döngü kuruyordu)
          cat > www/offline.html <<'HTML'
          <!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>Deutsch-Werkstatt</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px -apple-system,system-ui,sans-serif;background:#F1F6FB;color:#13233A;text-align:center;padding:24px}
          button{margin-top:18px;font:inherit;font-weight:700;color:#fff;background:#1784D6;border:0;border-radius:16px;padding:14px 28px;box-shadow:0 4px 0 #0E5E9E}</style></head>
          <body><div><div style="font-size:3rem">📡</div><h2>İnternet bağlantısı yok</h2><p>Bağlantı gelince tekrar dene.</p>
          <button onclick="location.href='https://mutemadiyennn.github.io/deutsch-werkstatt/v2/'">Tekrar dene</button></div></body></html>
          HTML

      - name: Initialize Capacitor and Add iOS
        run: |
          npx cap init "Deutsch Werkstatt" "com.mutemadiyenn.deutschwerkstatt" --web-dir=www
          # Kabuk, yayındaki sayfayı açar: güncellemeler anında gelir, Firebase girişi yetkili adreste çalışır.
          # Kabuk 1.6 (PM-128, PM-142 md. 2.1): adres doğrudan v2 (`/v2/`, sondaki eğik çizgiyle: yönlendirmesiz 200). Kök (v1)
          # sayfadan geçilmez; v1 tarayıcıda kök adreste açık kalır.
          rm -f capacitor.config.ts capacitor.config.js
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.mutemadiyenn.deutschwerkstatt",
            "appName": "Deutsch Werkstatt",
            "webDir": "www",
            "server": {
              "url": "https://mutemadiyennn.github.io/deutsch-werkstatt/v2/",
              "allowNavigation": ["mutemadiyennn.github.io"],
              "errorPath": "offline.html"
            },
            "backgroundColor": "#F1F6FB",
            "ios": { "contentInset": "never", "allowsLinkPreview": false, "backgroundColor": "#F1F6FB", "limitsNavigationsToAppBoundDomains": true }
          }
          JSON

          # Hata verirse bile durma, devam et
          npx cap add ios || true

          # Sürümü zorla 15.0 yap
          perl -pi -e "s/platform :ios, .*/platform :ios, '15.0'/" ios/App/Podfile || true
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj

          npx cap sync ios

      - name: Add Permissions
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Konuşma alıştırmaları için mikrofon gerekli.'" $P || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Konuşma alıştırmaları için mikrofon gerekli.'" $P
          # kurs ödevi fotoğrafı için (yoksa fotoğraf seçerken uygulama kapanır)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Ödev sayfasının fotoğrafını çekmek için.'" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Ödev fotoğrafını seçmek için.'" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Söylediğin Almanca cümleyi yazıya çevirip kontrol etmek için.'" $P || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'Söylediğin Almanca cümleyi yazıya çevirip kontrol etmek için.'" $P
          # Arka planda ses (arabada sesli tekrar ekran kapanınca da sürsün)
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P || true

      - name: Kabuk adresi ve izin anahtarları denetimi (Kabuk 1.6, PM-128)
        run: |
          # Kabul: kabuk adresiyle açılış hata sayfasına düşmez. server.url ve "Tekrar dene" aynı adres ve v2 (kabuk.json aynısını yazar);
          # adres yönlendirmesiz 200 verir ve v2 uygulamasıdır (kök v1 sayfası değil); konuşma için iki izin anahtarı dolu
          U=$(node -p 'require("./capacitor.config.json").server.url')
          echo "server.url = $U"
          [ "$U" = "https://mutemadiyennn.github.io/deutsch-werkstatt/v2/" ] || { echo "::error::server.url v2 değil: $U"; exit 1; }
          grep -q "location.href='$U'" www/offline.html || { echo "::error::offline.html 'Tekrar dene' server.url'e gitmiyor"; exit 1; }
          K=$(curl -sS -o /tmp/acilis.html -w '%{http_code} %{redirect_url}' "$U")
          echo "açılış: $K"
          [ "$K" = "200 " ] || { echo "::error::kabuk adresi yönlendirmesiz 200 vermedi: $K"; exit 1; }
          grep -qE 'src="\./assets/index-[^"]+\.js"' /tmp/acilis.html || { echo "::error::kabuk adresindeki sayfa v2 uygulaması değil"; exit 1; }
          ! grep -q 'location.replace' /tmp/acilis.html || { echo "::error::kabuk adresindeki sayfada yönlendirme var"; exit 1; }
          P=ios/App/App/Info.plist
          for k in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" $P) && [ -n "$v" ] || { echo "::error::$k yok"; exit 1; }
            echo "$k = $v"
          done

      - name: Native Tweaks
        run: |
          P=ios/App/App/Info.plist
          # Uygulamaya bağlı alan adı: iOS ancak böyle service worker'a (internetsiz açılış) izin veriyor
          /usr/libexec/PlistBuddy -c "Delete :WKAppBoundDomains" $P || true
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains array" $P
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:0 string mutemadiyennn.github.io" $P
          # Sadece dikey (araçta tutucuda dönmesin)
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          # Uygulama açıkken ekran kararmasın (eller serbest çalışma) + sessiz modda da ses çıksın
          AD=ios/App/App/AppDelegate.swift
          if grep -q "import Capacitor" $AD && ! grep -q "import AVFoundation" $AD; then
            perl -0pi -e 's/import Capacitor\n/import Capacitor\nimport AVFoundation\n/' $AD
          fi
          perl -0pi -e 's/(didFinishLaunchingWithOptions[^\{]*\{\n)/$1        application.isIdleTimerDisabled = true\n        try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [])\n/' $AD
          cat $AD | head -30
          # Açılış ekranı: uygulamanın açık zemin rengi (Capacitor logosu yerine)
          python3 - <<'PY'
          import zlib, struct, glob
          def png(w, h, rgb):
              raw = b"".join(b"\x00" + bytes(rgb) * w for _ in range(h))
              def ch(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw, 9)) + ch(b"IEND", b"")
          data = png(2732, 2732, (0xF1, 0xF6, 0xFB))
          for f in glob.glob("ios/App/App/Assets.xcassets/Splash.imageset/*.png"):
              open(f, "wb").write(data)
          PY

      - name: Shell version and plugin list (kabuk.json)
        run: |
          # PM-071 1. adım: kabuk sürümü Info.plist'e yazılır (uygulamada Profil → Ses ve mikrofon → "Kabuk" satırı okur);
          # içerideki eklentiler sürümleriyle günlüğe ve pakete (kabuk.json) yazılır
          SURUM="$(date -u +%Y.%m.%d)"; YAPI="${{ github.run_number }}"
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SURUM" $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $YAPI" $P
          echo "== npx cap ls ios (yerel projeye giren eklentiler)"; npx cap ls ios
          SURUM="$SURUM" YAPI="$YAPI" node -e '
            const fs = require("fs"); const d = require("./package.json").dependencies || {};
            const ad = Object.keys(d).filter((k) => k !== "@capacitor/cli").sort();
            const surum = (k) => JSON.parse(fs.readFileSync(`node_modules/${k}/package.json`, "utf8")).version;
            // yerel projeye bağlanan eklentiler: CocoaPods (ios/App/Podfile) ya da Swift Package Manager (ios/App/CapApp-SPM/Package.swift)
            const kaynak = ["ios/App/Podfile", "ios/App/CapApp-SPM/Package.swift"].filter((f) => fs.existsSync(f));
            const metin = kaynak.map((f) => fs.readFileSync(f, "utf8")).join("\n");
            const eksik = ad.filter((k) => k !== "@capacitor/core" && k !== "@capacitor/ios" && !metin.includes(`node_modules/${k}`));
            const j = { kabuk: `${process.env.SURUM} (${process.env.YAPI})`, ios_hedef: "15.0", adres: "https://mutemadiyennn.github.io/deutsch-werkstatt/v2/",
              capacitor: surum("@capacitor/core"), paket_yoneticisi: kaynak, eklentiler: Object.fromEntries(ad.map((k) => [k, surum(k)])), baglanmayan: eksik };
            fs.writeFileSync("kabuk.json", JSON.stringify(j, null, 2) + "\n");
            if (!kaynak.length || eksik.length) { console.error("::error::Yerel projeye baglanmayan eklenti: " + (eksik.join(", ") || "Podfile ya da Package.swift yok")); process.exit(1); }'
          echo "== kabuk.json"; cat kabuk.json
          { echo "### Kabuk"; echo '```json'; cat kabuk.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build iOS App (Unsigned)
        run: |
          build() {
            if [ -d ios/App/App.xcworkspace ]; then
              xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
            else
              xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
            fi
          }
          # PM-071 1. adım: eklenti çıkarıp yeniden deneme yok; derleme kırılırsa iş kırmızı (telefondaki kabukta ne olduğu hep belli)
          build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/App.app Payload/
          # kabuk.json pakete de girer (Payload/App.app/kabuk.json)
          cp kabuk.json Payload/App.app/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            App.ipa
            kabuk.json
