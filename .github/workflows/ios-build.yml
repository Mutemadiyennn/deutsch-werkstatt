name: Build Unsigned iOS IPA

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Initialize Capacitor and Add iOS
        run: |
          npx cap init "Deutsch Werkstatt" "com.mutemadiyenn.deutschwerkstatt" --web-dir=. --yes
          npx cap add ios

      - name: Add Microphone Permission
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Mikrofon izni gerekli.'" ios/App/App/Info.plist

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          
      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: App.ipa
