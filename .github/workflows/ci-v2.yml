name: v2 — kontrol (tip, birim, içerik, derleme, WebKit uçtan uca, görsel)

on:
  push:
    branches: [main]
    paths: ["web/**", "worker/**", "packages/**", "content/**", "tests/e2e/**", "scripts/**", "package.json", "package-lock.json", ".github/workflows/ci-v2.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tip denetimi
        run: npm run typecheck
      - name: Birim testleri (çekirdek, veri, servisler, Worker, içerik)
        run: npm test
      - name: İçerik kapısı (0 hata)
        run: npm run content:validate
      - name: "Dikiş denetçisi (PM-090 md. 2.1): günler ↔ a1-kesin.json tablosu ve omurga, 0 ihlal"
        run: node --experimental-strip-types --no-warnings content/tools/dikis-kos.ts
      - name: "Hafta kapısı (PM-087 B.1): 2. hafta ve sonrası, öğretilmeden istenen 0, hafta sonu testi ≥ %80, görülmemiş durum"
        run: node --experimental-strip-types --no-warnings content/tools/hafta-kapisi-kos.ts --hepsi
      - name: Raf doldurma hattı birim testleri (ağsız; D-112)
        run: python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || python3 -m pip install --quiet pillow; python3 scripts/raf/test_doldur.py
      - name: Gizli anahtar taraması (Firebase web yapılandırması hariç)
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- ':!app/legacy.html' ':!web/src/services/auth.ts' ':!app/tests/*' | grep -v 'AIzaSyDU2GSwCowKMKWBOvTZdKQjCtxLsQFTlDg'; then echo "Anahtar bulundu"; exit 1; fi
      - name: Derleme + paket bütçesi (ilk açılış JS ≤ 250 KB, toplam JS ≤ 300 KB gzip)
        run: |
          npm run content:build
          npm run build -w web
          # Worker adresi üretim paketinde olmalı, e2e paketinde olmamalı (inceleme #123 P2-5)
          A=$(sed -n 's/^VITE_API_BASE=//p' web/.env.production); [ -n "$A" ] && grep -q "$A" web/dist/assets/*.js || { echo "::error::üretim paketinde Worker adresi yok"; exit 1; }
          # yalnız e2e'deki deneme yolları üretim paketine girmez (AK-10 3. adım #/__halka-turleri, #/__crash)
          ! grep -lE "__halka-turleri|e2e: bilerek hata" web/dist/assets/*.js || { echo "::error::e2e deneme yolu üretim paketinde"; exit 1; }
          # e2e paketi: içerikte henüz olmayan M1 günü için örnek gün (yayın paketine girmez)
          DW_E2E_FIXTURES=1 npm run content:build
          (cd web && npx vite build --mode e2e --outDir dist-e2e)
          ! grep -q "$A" web/dist-e2e/assets/*.js || { echo "::error::e2e paketine gerçek Worker adresi sızdı"; exit 1; }
          # D-126 (PM 7061394696, phases/05 md. 5): ilk açılış JS'i = index.html'in bağladığı giriş parçası + statik bağımlıları
          # (modulepreload); liste derleme çıktısından okunur. Toplam (tembel parçalar dahil) büyüme bekçisidir; sınırı PM kararıyla değişir.
          I=0; for f in $(grep -oE '(src|href)="\./assets/[^"]+\.js"' web/dist/index.html | sed -E 's/^[a-z]+="\.\///; s/"$//' | sort -u); do I=$((I + $(gzip -9c "web/dist/$f" | wc -c))); done
          T=0; for f in web/dist/assets/*.js; do T=$((T + $(gzip -9c "$f" | wc -c))); done
          echo "JS ilk açılış (gzip): $((I/1024)) KB ($I B; sınır 256000) · JS toplam (gzip): $((T/1024)) KB ($T B; sınır 307200)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$I" -gt 0 ] || { echo "ilk açılış JS listesi index.html'den okunamadı"; exit 1; }
          [ "$I" -le 256000 ] || { echo "JS bütçesi aşıldı (ilk açılış)"; exit 1; }
          [ "$T" -le 307200 ] || { echo "JS bütçesi aşıldı (toplam)"; exit 1; }
      - name: Worker paketlenebilir mi
        run: (cd worker && npx wrangler deploy --dry-run --outdir /tmp/wb)
      - uses: actions/upload-artifact@v4
        with: { name: dist-e2e, path: web/dist-e2e, retention-days: 3 }

  webkit:
    # Kabul ölçütü (DECISIONS D-040): iPhone profilleriyle WebKit
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 15", "iPhone 15 Pro Max", "iPhone 16 Pro Max"]
    env: { E2E_BROWSER: webkit, E2E_DEVICE: "${{ matrix.device }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-e2e, path: web/dist-e2e }
      - uses: actions/setup-node@v4   # v2_raf.py gerçek raf Function'ını Node ile koşar (inceleme #98 2. tur)
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # apt aynası zaman zaman çok yavaş (140 MB'ı 12 dakikada indiremedi): indirilen .deb'ler ve tarayıcı önbelleğe alınır
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: pw-webkit-${{ runner.os }}-${{ hashFiles('.github/workflows/ci-v2.yml') }}
          restore-keys: pw-webkit-${{ runner.os }}-
      - name: Playwright + WebKit
        timeout-minutes: 22
        run: |
          pip install playwright==1.* pillow
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99dw-net >/dev/null
          mkdir -p ~/apt-debs
          if ls ~/apt-debs/*.deb >/dev/null 2>&1; then sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/; echo "önbellekten $(ls ~/apt-debs/*.deb | wc -l) paket"; fi
          ok=0
          for i in 1 2 3; do
            # takılan denemenin kilidi temizlenir (dpkg lock → exit 100); indirilmiş paketler bir sonraki denemede kalır
            if timeout 420 python -m playwright install --with-deps webkit; then ok=1; break; fi
            echo "kurulum denemesi $i takıldı, kilit temizlenip yeniden"
            sudo pkill -9 -f apt-get || true; sudo pkill -9 -f dpkg || true
            sudo rm -f /var/lib/dpkg/lock* /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true; sleep 5
          done
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error::WebKit bağımlılıkları kurulamadı (apt aynası). Test sonucu değil; yeniden çalıştırın."; exit 1; }
      - name: Çekirdek akış (giriş, kurulum, tespit, Bugün, odak, İlerlemem, Profil)
        run: cd tests/e2e && python v2_core.py
      - name: Oynatıcı (aşama 1–6, dinleme, klavye, uzun basma, dayanıklılık, taşma, %130)
        run: cd tests/e2e && python v2_player.py --shots /tmp/shots
      - name: Yapay zekâ hata durumları (PM-087 A.4)
        run: cd tests/e2e && python v2_yz_hata.py --tablo /tmp/yz-hata.md
      - name: DN-2 gezgin (her ekranda her düğme)
        run: mkdir -p /tmp/shots && cd tests/e2e && python gezgin.py --out /tmp/shots/gezgin.json
      - name: "Yerleşim bekçisi (PM-079 md. 4): B1–B8, gezginin ekranları, 844 ve 932 yükseklik; kip dosyada (rapor → kırmızı)"
        run: cd tests/e2e && python yerlesim_bekcisi.py --out /tmp/shots/yerlesim.json
      - name: DN-2 yükleme sınırı (ilk açılış, sekme geçişi, takılan içerik)
        run: cd tests/e2e && python yukleme.py
      - name: DN-2 uçak modu günü (çevrimdışı)
        run: cd tests/e2e && python ucak.py
      - name: "Kelime Bahçesi (PM-049, #58 A3): tur, üretim yolu, duyduğum kelime"
        run: cd tests/e2e && python v2_garden.py --shots /tmp/shots
      - name: "Medya bölüm oynatıcısı (#58 A4): 5 dk video 3 bölüm, a–g, dikte merdiveni, anons"
        run: cd tests/e2e && python v2_medya.py --shots /tmp/shots
      - name: "Veri güvenliği ve hata sınırı (#58 A12)"
        run: cd tests/e2e && python v2_veri.py
      - name: "Temel ders oynatıcısı (#58 A5, Seans 2): R0 dersi baştan sona"
        run: cd tests/e2e && python v2_ders.py --shots /tmp/shots
      - name: "Ders ve Bahçe döngüsüzlüğü (B5, PM 7030294523): bugün Bahçede görülen kelime derste yeniden tanıtılmaz, en çok bir kez cümle içinde sorulur"
        run: cd tests/e2e && python v2_ders_bahce.py --shots /tmp/shots
      - name: "Öğrenci devam betiği (PM 7030294523 4b): 3. günün 4. adımına tohumla, kaydedilen durumdan aynı yerden aç"
        run: cd tests/e2e && python ogrenci_devam.py --gun 3 --adim 3 --durum /tmp/ogrenci-durum.json && python ogrenci_devam.py --gun 5 --adim 0
      - name: "Ders yolu (#58 A5b): 1. gün Bugün'den baştan sona (Bahçe → temel ders → video + sesler), XP ve seri"
        run: cd tests/e2e && python v2_yol.py --shots /tmp/shots
      - name: "Yol haritası ve durum çubuğu (#58 B11a, PM-065): düğümler, BAŞLA, kilitli, gün bandı ve Rehber, seri/XP/dakika, kontrast"
        run: cd tests/e2e && python v2_yol_harita.py --shots /tmp/shots
      - name: "Sekme çerçevesi (PM-084 md. 3, Hedef 3): Bugün · Yol · Köy · Ben, etkin durum, eski adresler yönlenir, tam ekran akışlarda sekme yok"
        run: cd tests/e2e && python v2_sekme.py --shots /tmp/shots
      - name: "Köy (PM-084 md. 4, Hedef 3): dükkân ızgarası, kilitli dükkânlar, gerçek sayılar, Telefonun kartı, eski Öğren girişleri ≤ 2 dokunuş"
        run: cd tests/e2e && python v2_koy.py --shots /tmp/shots
      - name: "Seçilmiş açık fotoğraf (#58 B12 3. parça): kartta atıfla, kayıt yoksa alan yok"
        run: cd tests/e2e && python v2_foto.py
      - name: "Ses ve mikrofon (#58 B15 1. adım, PM-064): karaktere göre ses, Yavaş yalnızca hız, mikrofon yolu ve Türkçe hata türleri"
        run: cd tests/e2e && python v2_ses.py --shots /tmp/shots
      - name: "Günlük görevler, sandık, seri dondurma, geçen haftaki sen (#58 B11b, PM-065 5–7)"
        run: cd tests/e2e && python v2_gorev.py --shots /tmp/shots
      - name: "Yerleşim kuralları Y1–Y6 (TASARIM TS-4.7): Bugün, Görevler, Odak; iki tema"
        run: cd tests/e2e && python v2_yerlesim.py
      - name: "Yeni Bugün + Pomodoro (#58 A6): halka, seans x/4, Devam et süreyi başlatır, mola zili/titreşimi, kilitte doğru süre"
        run: cd tests/e2e && python v2_bugun.py --shots /tmp/shots
      - name: "Konuşma provası (#58 A7): hazırlık kilidi, dallanan diyalog, tanınmayan cevap, Türkçe geri bildirim"
        run: cd tests/e2e && python v2_prova.py --shots /tmp/shots
      - name: "Okuma ve yazma (#58 A8): metin + kelime kartı, sorular, zorunlu kelime ve kalıp kontrolü, örnek, kontrol listesi"
        run: cd tests/e2e && python v2_okuma.py --shots /tmp/shots
      - name: "Kalıp kartı (#58 B2): kural, örnekler, slot doldurma, dönüşümler, sık hata; Sözlük'ten bağlantı"
        run: cd tests/e2e && python v2_kalip.py --shots /tmp/shots
      - name: "Bahçe değişen cümle (PM-062, #58 B13): Başka cümle 3 dokunuşta 3 cümle, <150 ms, uçak modunda; ipucu sayılmaz"
        run: cd tests/e2e && python v2_bahce_donusum.py --shots /tmp/shots
      - name: "Üst çubuk başlığı tek satır; medya ve senaryoda tek doğru birincil eylem (PM-074 G2, md. 2–3)"
        run: cd tests/e2e && python v2_baslik.py --shots /tmp/shots
      - name: "En uzun tanıtım kartı düğmelere değmeden sığar; en çok 3 eşdizim (PM 7024150313)"
        run: cd tests/e2e && python v2_tanitim_sigar.py --shots /tmp/shots
      - name: "Hızlı şerit (#58 B16, PM-066): Biliyorum sına beni, öneri, tespit A2 varsayılan, tanıma sorusu görmeden tur"
        run: cd tests/e2e && python v2_hizli.py --shots /tmp/shots
      - name: "Şölen 1 (#58 B10): cevap anı, ilerleme çubuğu, XP ve seri, tur sonu kutlaması, efekt sesi ayarı, hareket azaltma"
        run: cd tests/e2e && python v2_solen.py --shots /tmp/shots
      - name: "Gün sonu özeti ve yerel kullanım ölçümü (#58 B3): bırakma noktası, biten adım, kendi cümlen, yeni kelimeler; ağa gitmez"
        run: cd tests/e2e && python v2_gunsonu.py --shots /tmp/shots
      - name: "Kapalı medya rafı (#58 B12, D-112): Profil'de adres ve anahtar, Rafı sına (bağlandı / anahtar yanlış / ulaşılamıyor), yedeğe girmez"
        run: cd tests/e2e && python v2_raf.py --shots /tmp/shots
      - name: "Sözlük arama (#58 B1): DE↔TR, çekimli biçim, kart, Duyduğum kelime olarak Bahçe'ye"
        run: cd tests/e2e && python v2_sozluk.py
      - name: "Dinleme başlangıç hızı (#58 B7): Yavaş seçiliyse ilk çalma yavaş, tekrar normal; Profil'de Normal etkili"
        run: cd tests/e2e && python v2_hiz.py
      - name: "Halka adım türleri (AKIS AK-10 3. adım): resimden seç, eşleştir; açık + koyu, 932/844, ağ kesik"
        run: cd tests/e2e && python v2_halka_tur.py --shots /tmp/shots
      - name: "Akış (AKIS AK-10 4a): #/akis/2 ilk halka baştan sona, yeniden açınca aynı adım, yanlış kart bir kez daha"
        run: cd tests/e2e && python v2_akis.py --shots /tmp/shots
      - name: "Pilot 1. gün (bayrak #193): #/akis/1 baştan sona, her kalıp çerçevesine örnek, gün sonu ve Bugün'e dönüş"
        run: cd tests/e2e && python v2_akis.py --tam --kalip-sert --gun 1
      - name: "Pilot 1. gün: mikrofon varken akışta büyük mikrofon ve 'Yazarak cevapla' (bayrak #193 md. 3)"
        run: cd tests/e2e && python v2_akis.py --mikrofon --gun 1
      - name: "Akış bayrağı 'hepsi' (PM-090 md. 3): 1. gün bitince 2. günün BAŞLA'sı akışa gider; [1] ve [] ile eski düzen"
        run: cd tests/e2e && python v2_akis_hepsi.py
      - name: "Dil noktası durağı (PM-092 md. 1, #231): paketteki bütün dil noktaları telefonda sığar, tablo bölünmez, sesli örnekler, tek 'Anladım'"
        run: cd tests/e2e && python v2_dil_noktasi.py --shots /tmp/shots && python v2_dil_noktasi.py --ts 1.3 && python v2_dil_noktasi.py --genislik 320 && python v2_dil_noktasi.py --ts 1.3 --genislik 320
      - name: "Çok haftalı Yol (PR B-3): 2. hafta açık, 1. hafta tek satır, yalnız haftanın gün dosyaları, gün kilidi, hafta sonu testi; açık + koyu"
        run: cd tests/e2e && python v2_yol_hafta.py --shots /tmp/shots && python v2_yol_hafta.py --scheme dark --shots /tmp/shots
      - name: "8. gün fikstürü (#231 P1-3): gr: dersli gün baştan sona, dil noktası durağı, ders:<id> yazımı"
        run: cd tests/e2e && python v2_akis.py --tam --gun 8
      - name: Görsel regresyon (açık + koyu)
        run: cd tests/e2e && python visual.py --out /tmp/visual --baseline "visual-baseline/${{ matrix.device }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "webkit-${{ matrix.device }}", path: "/tmp/visual\n/tmp/shots", retention-days: 14 }
