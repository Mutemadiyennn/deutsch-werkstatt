name: B14 CPU ölçümü (FLUX.1-schnell, ekran kartısız; yalnız ölçüm)
# PM 7042126990-3: tek iş, en çok 60 dk, zamanlanmış koşu YOK. Tetik: kaynak/gorsel dalında cpu-olcum.txt'ye dokunmak
# (workflow_dispatch düğmesi yalnız varsayılan daldaki iş akışlarında görünür; bu yüzden tek dosyalık el tetiği).
on:
  push:
    branches: ["kaynak/gorsel"]
    paths: ["content/v2/media/uretim/cpu-olcum.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: b14-cpu, cancel-in-progress: false }
jobs:
  olcum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Yer aç (model ~10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1; nproc; free -g | head -2
      - name: stable-diffusion.cpp derle (CPU)
        run: |
          pip install -q pillow==11.0.0
          git clone -q --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cmake -S sdcpp -B sdcpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON >/dev/null
          cmake --build sdcpp/build -j"$(nproc)" >/dev/null
          ls sdcpp/build/bin
      - name: Modeli indir (second-state/FLUX.1-schnell-GGUF, Apache-2.0)
        run: |
          mkdir -p model; U=https://huggingface.co/second-state/FLUX.1-schnell-GGUF/resolve/main
          for f in flux1-schnell-Q4_0.gguf t5xxl-Q4_0.gguf clip_l.safetensors ae.safetensors; do curl -sSfL --retry 3 -o model/$f $U/$f & done; wait
          ls -la model; df -h / | tail -1
      - name: Ölçüm (8 deneme sahnesi, 768×576, 4 adım)
        run: |
          SD=$(ls sdcpp/build/bin/sd-cli sdcpp/build/bin/sd 2>/dev/null | head -1); echo "ikili: $SD"
          python scripts/gorsel/cpu_olcum.py "$SD" model out --sinir-dk 38
      - name: Releases (m1-gorsel-deneme yanına)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          shopt -s nullglob; f=(out/cpu-*.jpg out/galeri-cpu.html out/cpu-ozet.json)
          [ ${#f[@]} -gt 0 ] || { echo "çıktı yok"; exit 0; }
          gh release upload m1-gorsel-deneme "${f[@]}" --clobber
          cat out/cpu-ozet.json | head -12
