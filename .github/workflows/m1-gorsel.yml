name: "PM-063 cümle görseli denemesi (#58 B14): Workers AI flux-1-schnell, 30 sahne × 2 üslup, Releases'e galeri"
# Yalnızca kaynak/gorsel dalına push'ta. Hesap Workers Free, ödeme yöntemi yok (PM 7009256371): kota aşılırsa hata, ücret yok.
# Anahtar yalnızca GitHub şifreli secret'ında: CF_AI_TOKEN ('Workers AI' izinli API jetonu; yoksa CLOUDFLARE_API_TOKEN denenir).
# Görseller depoya girmez (D-103): Releases `m1-gorsel-deneme`; depoya yalnızca kayıt (content/v2/media/uretim/deneme-kayit.json).
on:
  push:
    branches: ["kaynak/gorsel"]
    paths: ["scripts/gorsel/**", ".github/workflows/m1-gorsel.yml", "content/v2/media/uretim/sahne-*.json"]
permissions:
  contents: write
concurrency: { group: m1-gorsel, cancel-in-progress: false }
jobs:
  gorsel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow==11.0.0
      - name: Üretim (bütçe 3.500 nöron)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/gorsel/uret.py out --butce 3500
      - name: Releases (m1-gorsel-deneme)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          shopt -s nullglob
          f=(out/*.jpg out/galeri.html)
          [ ${#f[@]} -eq 0 ] && { echo "görsel yok"; exit 0; }
          gh release view m1-gorsel-deneme >/dev/null 2>&1 || gh release create m1-gorsel-deneme --prerelease --title "PM-063 cümle görseli denemesi" \
            --notes "Workers AI flux-1-schnell ile üretildi (kaynak: uretim, sinif: acik). Kayıt content/v2/media/uretim/deneme-kayit.json (kaynak/gorsel dalı). PM gözle onaylamadan hat kurulmaz."
          for ((i=0; i<${#f[@]}; i+=50)); do gh release upload m1-gorsel-deneme "${f[@]:i:50}" --clobber; done
      - name: Kaydı dala yaz
        if: always()
        run: |
          [ -f content/v2/media/uretim/deneme-kayit.json ] || exit 0
          git config user.name "dw-gorsel-hatti"; git config user.email "dw-gorsel-hatti@users.noreply.github.com"
          git add content/v2/media/uretim/deneme-kayit.json
          git diff --cached --quiet || (git commit -m "PM-063: deneme kaydı (otomatik) [skip ci]" && git push)
