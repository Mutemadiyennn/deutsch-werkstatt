name: "M1 video hattı (#58 A9): indir, iki ASR ile ölç, hizala, kes, Releases'e yükle"
# Yalnızca kaynak/video dalına push'ta ya da elle çalışır. Ücretsiz katman; anahtar yok. Ses ve transkript depoya girmez:
# medya ve metin GitHub Releases (m1-medya) varlığıdır; depoya yalnızca sayılar (klip-NN.olcum.json) yazılır (#42 §4.6).
on:
  push:
    branches: ["kaynak/video"]
    paths: ["scripts/video/**", ".github/workflows/m1-video.yml", "content/v2/m1/video/klip-0*.json"]
  workflow_dispatch:
    inputs:
      klipler: { description: "boşlukla ayrılmış klip adları (ör. klip-02 klip-04); boşsa hepsi", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: m1-video, cancel-in-progress: false }
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: m1-video-modeller-v1
      - name: Bağımlılıklar (CPU)
        run: |
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q faster-whisper==1.1.1 "av>=11,<14" "transformers<4.50" soundfile jiwer==3.0.5 num2words==0.5.14
      - name: Hat
        # push'ta yalnızca M1_KLIPLER'deki klipler (önce tek klip ile doğrulama); elle çalıştırmada girilenler
        env: { M1_KLIPLER: "klip-01 klip-02 klip-04 klip-05 klip-06 klip-07" }
        run: python scripts/video/m1_video.py out ${{ github.event.inputs.klipler || '$M1_KLIPLER' }}
      - name: Releases (m1-medya)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la out
          gh release view m1-medya >/dev/null 2>&1 || gh release create m1-medya --prerelease --title "M1 gerçek insan videoları" \
            --notes "Deutsch im Blick (COERLL, University of Texas at Austin), CC BY 4.0. Kesitler ve hizalanmış Almanca metin; atıf her klipte. #58 A9."
          shopt -s nullglob
          f=(out/klip-*.mp4 out/klip-*.jpg out/klip-*.metin.json)
          [ ${#f[@]} -gt 0 ] && gh release upload m1-medya "${f[@]}" --clobber || echo "yüklenecek varlık yok"
      - name: Ölçümleri dala yaz (yalnızca sayılar)
        run: |
          git config user.name "dw-video-hatti"; git config user.email "dw-video-hatti@users.noreply.github.com"
          git add content/v2/m1/video/*.olcum.json || true
          git diff --cached --quiet || (git commit -m "M1 A9: klip ölçümleri (otomatik) [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: m1-video-gunluk, path: "out/*.json", retention-days: 7 }
  oynatma:
    # Releases adresinden WebKit oynatması (#58 A9 "Barındırma"): oynamazsa Pages'e geçilir
    needs: video
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Playwright + WebKit (apt aynası takılırsa 3 deneme)
        run: |
          pip install -q "playwright==1.*"
          # sudo python setup-python ortamını görmez; Playwright sudo'yu kendisi çağırır (ci-v2 ile aynı yol)
          ok=0
          for i in 1 2 3; do
            if timeout 420 python -m playwright install --with-deps webkit; then ok=1; break; fi
            echo "kurulum denemesi $i takıldı"; sudo pkill -9 -f apt-get || true; sudo pkill -9 -f dpkg || true
            sudo rm -f /var/lib/dpkg/lock* /var/lib/apt/lists/lock /var/cache/apt/archives/lock; sudo dpkg --configure -a || true; sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::WebKit bağımlılıkları kurulamadı"; exit 1; }
      - name: WebKit'te Releases'ten oynatma
        run: python scripts/video/oynatma.py https://github.com/Mutemadiyennn/deutsch-werkstatt/releases/download/m1-medya/klip-02.mp4
