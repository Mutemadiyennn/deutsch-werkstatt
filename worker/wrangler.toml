# Deutsch Werkstatt API — Cloudflare Worker (ücretsiz plan).
# Gizli değerler depoya YAZILMAZ; şu komutlarla girilir:
#   npx wrangler secret put GEMINI_KEY
#   npx wrangler secret put ALLOWED_UIDS      # Firebase uid (virgülle)
# KV: kimlik depoya yazılmaz; Cloudflare Workers Builds derlemesinde QUOTA_KV_ID derleme değişkeninden doldurulur
#     (npm run cf:hazirla -w worker; docs/v2/CLOUDFLARE_TELEFON.md G). Gizliler Cloudflare panelinden (PM-081 C).
name = "deutsch-werkstatt-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
FIREBASE_PROJECT_ID = "deutsch-sync"
ALLOWED_ORIGINS = "https://mutemadiyennn.github.io,capacitor://localhost,http://localhost:5173,http://localhost:4173"
AI_DAILY_LIMIT = "300"
# PM-019 / D-093: Gemini kapalı (AEA şartı + güvenilmezlik). PM 7022002310-5: Workers AI (deneme; model ve günlük nöron
# tavanı worker/policy.json). Kapatmak için: AI_PROVIDER = "none".
AI_PROVIDER = "workers-ai"

# Workers AI bağlamı: anahtar yok, hesabın ücretsiz payı (Workers Free, ödeme yöntemi yok: pay dolarsa hata, ücret yok)
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "QUOTA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
